<svg viewBox="0 0 380 320" xmlns="http://www.w3.org/2000/svg" style="background:white;font-family:Arial,sans-serif;">
  <!-- Compass radial survey from O -->
  <!-- N arrow up, A upper-right, B at 110°, D at 285°, C opposite A (AC straight line) -->
  <!-- OA=67.5m, OB=40m, OD=38m, 42m label (possibly DA chord or OA component) -->
  <!-- From image: O is centre, N points up, A is NE of O, labels 67.5m and 42m near top -->
  <!-- D at 285° (WNW), B at 110° (ESE), C is diametrically opposite A through O -->

  <!-- O at (190, 155). Scale: 1m ≈ 2px -->
  <!-- A at bearing ~020° from O, OA=67.5m: A=(190+67.5*2*sin20°, 155-67.5*2*cos20°) -->
  <!--   = (190+46.2, 155-126.9) = (236, 28) -->
  <!-- B at bearing 110°: B=(190+40*2*sin110°, 155-40*2*cos110°) -->
  <!--   = (190+75.2, 155+27.4) = (265, 182) -->
  <!-- D at bearing 285°: D=(190+38*2*sin285°, 155-38*2*cos285°) -->
  <!--   = (190-73.5, 155-19.7) = (117, 135) -->
  <!-- C opposite A (bearing 020+180=200°): OC=OA=67.5m? Or separate distance -->
  <!--   C=(190-46.2, 155+126.9) = (144, 282) -->

  <!-- N arrow -->
  <line x1="190" y1="155" x2="190" y2="25" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="190,18 185,32 195,32" fill="#1a1a1a"/>
  <text x="195" y="22" font-size="14" font-weight="bold" fill="#1a1a1a">N</text>

  <!-- Lines from O to each point -->
  <!-- O to A -->
  <line x1="190" y1="155" x2="236" y2="28" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- O to C (extension of OA through O) -->
  <line x1="190" y1="155" x2="144" y2="282" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- O to B -->
  <line x1="190" y1="155" x2="265" y2="182" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- O to D -->
  <line x1="190" y1="155" x2="117" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Polygon A-B-C-D connecting outer points -->
  <polygon points="236,28 265,182 144,282 117,135" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- O point -->
  <circle cx="190" cy="155" r="3" fill="#1a1a1a"/>
  <text x="195" y="162" font-size="13" font-style="italic" fill="#1a1a1a">O</text>

  <!-- Point labels -->
  <circle cx="236" cy="28" r="3" fill="#1a1a1a"/>
  <text x="240" y="26" font-size="14" font-style="italic" fill="#1a1a1a">A</text>

  <circle cx="265" cy="182" r="3" fill="#1a1a1a"/>
  <text x="270" y="188" font-size="14" font-style="italic" fill="#1a1a1a">B</text>
  <text x="262" y="200" font-size="12" fill="#555">(110°)</text>

  <circle cx="144" cy="282" r="3" fill="#1a1a1a"/>
  <text x="130" y="295" font-size="14" font-style="italic" fill="#1a1a1a">C</text>

  <circle cx="117" cy="135" r="3" fill="#1a1a1a"/>
  <text x="88" y="132" font-size="14" font-style="italic" fill="#1a1a1a">D</text>
  <text x="70" y="146" font-size="12" fill="#555">(285°)</text>

  <!-- Distance labels -->
  <!-- 67.5 m on OA (upper portion) -->
  <text x="198" y="85" font-size="12" fill="#1a1a1a">67.5 m</text>
  <!-- 42 m near A side -->
  <text x="240" y="108" font-size="12" fill="#1a1a1a">42 m</text>
  <!-- 38 m on OD -->
  <text x="138" y="142" font-size="12" fill="#1a1a1a">38 m</text>
  <!-- 40 m on OB -->
  <text x="226" y="162" font-size="12" fill="#1a1a1a">40 m</text>

  <!-- NOT TO SCALE -->
  <text x="290" y="75" font-size="11" fill="#555">NOT TO</text>
  <text x="293" y="89" font-size="11" fill="#555">SCALE</text>
</svg>
