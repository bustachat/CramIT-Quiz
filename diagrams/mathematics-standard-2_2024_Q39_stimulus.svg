<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" style="background:white;font-family:Arial,sans-serif;">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 L1.5,3 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <!-- Critical path network: 9 activities A,B,C,D,E,F,G,H,I -->
  <!-- From image: Start → A,B,C fan out; D from A; E,B,C merge to central; G,F,H; I→End -->
  <!-- Node layout from image: -->
  <!-- N0(start)=(45,150), N1=(160,75), N2=(160,150), N3=(160,225) -->
  <!-- N4=(290,75), N5=(290,150), N6=(290,225), N7=(420,150), N8(end)=(500,150) -->

  <!-- Start → A (upper) -->
  <line x1="49" y1="145" x2="153" y2="80" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="77" y="103" font-size="13" font-style="italic" fill="#1a1a1a">A</text>

  <!-- Start → B (middle) -->
  <line x1="51" y1="150" x2="153" y2="150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="88" y="144" font-size="13" font-style="italic" fill="#1a1a1a">B</text>

  <!-- Start → C (lower) -->
  <line x1="49" y1="155" x2="153" y2="220" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="78" y="200" font-size="13" font-style="italic" fill="#1a1a1a">C</text>

  <!-- N1 → N4: D -->
  <line x1="166" y1="73" x2="282" y2="76" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="215" y="67" font-size="13" font-style="italic" fill="#1a1a1a">D</text>

  <!-- N1/N2 → N5: E -->
  <line x1="166" y1="80" x2="284" y2="146" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="210" y="112" font-size="13" font-style="italic" fill="#1a1a1a">E</text>

  <!-- N2 → N5: (dummy/B path) -- actually B goes from N2 to N5 -->
  <!-- Let's use: N3 → N6: F -->
  <line x1="163" y1="222" x2="282" y2="222" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="210" y="216" font-size="13" font-style="italic" fill="#1a1a1a">F</text>

  <!-- N4 → N7: G -->
  <line x1="296" y1="79" x2="413" y2="145" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="340" y="103" font-size="13" font-style="italic" fill="#1a1a1a">G</text>

  <!-- N5 → N7: (merge) -->
  <line x1="296" y1="150" x2="413" y2="150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- N6 → N7: H -->
  <line x1="296" y1="220" x2="414" y2="157" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="338" y="204" font-size="13" font-style="italic" fill="#1a1a1a">H</text>

  <!-- N7 → End: I -->
  <line x1="427" y1="150" x2="492" y2="150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="452" y="144" font-size="13" font-style="italic" fill="#1a1a1a">I</text>

  <!-- Nodes -->
  <circle cx="45" cy="150" r="7" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="160" cy="75" r="6" fill="#1a1a1a"/>
  <circle cx="160" cy="150" r="6" fill="#1a1a1a"/>
  <circle cx="160" cy="225" r="6" fill="#1a1a1a"/>
  <circle cx="288" cy="75" r="6" fill="#1a1a1a"/>
  <circle cx="288" cy="150" r="6" fill="#1a1a1a"/>
  <circle cx="288" cy="225" r="6" fill="#1a1a1a"/>
  <circle cx="420" cy="150" r="6" fill="#1a1a1a"/>
  <circle cx="498" cy="150" r="7" fill="white" stroke="#1a1a1a" stroke-width="2"/>

  <!-- EST/LST table -->
  <rect x="20" y="240" width="240" height="52" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="100" y1="240" x2="100" y2="292" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="170" y1="240" x2="170" y2="292" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="20" y1="257" x2="260" y2="257" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Headers -->
  <text x="42" y="253" font-size="11" font-style="italic" fill="#1a1a1a">Activity</text>
  <text x="118" y="253" font-size="11" font-style="italic" fill="#1a1a1a">EST</text>
  <text x="188" y="253" font-size="11" font-style="italic" fill="#1a1a1a">LST</text>
  <!-- Row A -->
  <text x="58" y="270" font-size="11" font-style="italic" fill="#1a1a1a">A</text>
  <text x="128" y="270" font-size="11" fill="#1a1a1a">0</text>
  <text x="198" y="270" font-size="11" fill="#1a1a1a">2</text>
  <!-- Row C -->
  <text x="58" y="284" font-size="11" font-style="italic" fill="#1a1a1a">C</text>
  <text x="128" y="284" font-size="11" fill="#1a1a1a">0</text>
  <text x="198" y="284" font-size="11" fill="#1a1a1a">1</text>
  <!-- Row I at side -->
  <text x="270" y="270" font-size="11" font-style="italic" fill="#1a1a1a">I:</text>
  <text x="285" y="270" font-size="11" fill="#1a1a1a">EST = 12, LST = 12</text>
</svg>
