<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" style="background:white;font-family:Arial,sans-serif;">
  <!-- Shape APQBCD: rectangle ABCD with arc PQ on side AB -->
  <!-- BC=3.6m, CD=8.0m, arc radius=2.1m, angle POQ=110° -->
  <!-- A top-left, B top-right, C bottom-right, D bottom-left -->

  <!-- Rectangle: A(60,50), B(340,50), C(340,200), D(60,200) -->
  <!-- P and Q are on side AB (top), arc bulges upward -->
  <!-- O is inside the rectangle below P and Q -->
  <!-- Angle POQ=110°, radius=2.1m -->
  <!-- P and Q divide AB such that PQ arc is centred on O -->

  <!-- Let AB length represent 8.0m, BC=3.6m -->
  <!-- Scale: 8.0m = 280px => 1m = 35px -->
  <!-- BC = 3.6m = 126px -->
  <!-- AB width = 280px, BC height = 126px -->
  <!-- O is inside at some point below AB -->
  <!-- radius = 2.1m = 73.5px -->
  <!-- angle POQ = 110°, so half-angle = 55° from vertical -->
  <!-- P and Q are on AB at x = O_x ± r*sin(55°) -->
  <!-- sin(55°) ≈ 0.819, so P at O_x - 60.2, Q at O_x + 60.2 -->
  <!-- O_x = center of AB = 200px -->
  <!-- P at x=140, Q at x=260 -->
  <!-- O_y: O is below AB, at y = 50 + r*cos(55°) = 50 + 73.5*0.574 ≈ 50+42 = 92 -->

  <!-- Rectangle sides (excluding top AB which has arc) -->
  <!-- Left: A to P, then arc P to Q, then Q to B -->
  <line x1="60" y1="50" x2="140" y2="50" stroke="#1a1a1a" stroke-width="1.8"/>
  <!-- Arc PQ (bulging upward, so sweep upward = away from O) -->
  <path d="M 140,50 A 73.5,73.5 0 0 1 260,50" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="260" y1="50" x2="340" y2="50" stroke="#1a1a1a" stroke-width="1.8"/>
  <!-- Right side BC -->
  <line x1="340" y1="50" x2="340" y2="176" stroke="#1a1a1a" stroke-width="1.8"/>
  <!-- Bottom CD -->
  <line x1="340" y1="176" x2="60" y2="176" stroke="#1a1a1a" stroke-width="1.8"/>
  <!-- Left side DA -->
  <line x1="60" y1="176" x2="60" y2="50" stroke="#1a1a1a" stroke-width="1.8"/>

  <!-- O point (centre of arc, inside rectangle) -->
  <circle cx="200" cy="92" r="2.5" fill="#1a1a1a"/>

  <!-- Dashed lines from O to P and O to Q -->
  <line x1="200" y1="92" x2="140" y2="50" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="200" y1="92" x2="260" y2="50" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Corner labels -->
  <text x="43" y="46" font-size="14" font-style="italic" fill="#1a1a1a">A</text>
  <text x="344" y="46" font-size="14" font-style="italic" fill="#1a1a1a">B</text>
  <text x="344" y="185" font-size="14" font-style="italic" fill="#1a1a1a">C</text>
  <text x="43" y="185" font-size="14" font-style="italic" fill="#1a1a1a">D</text>

  <!-- P and Q labels -->
  <text x="130" y="44" font-size="13" font-style="italic" fill="#1a1a1a">P</text>
  <text x="261" y="44" font-size="13" font-style="italic" fill="#1a1a1a">Q</text>

  <!-- O label -->
  <text x="206" y="100" font-size="13" font-style="italic" fill="#1a1a1a">O</text>

  <!-- Angle label 110° near O -->
  <text x="193" y="80" font-size="12" fill="#1a1a1a">110°</text>

  <!-- Radius label 2.1 m on one dashed line -->
  <text x="155" y="68" font-size="12" fill="#1a1a1a">2.1 m</text>

  <!-- BC dimension (right side) -->
  <text x="348" y="120" font-size="12" fill="#1a1a1a">3.6 m</text>

  <!-- CD dimension (bottom) -->
  <text x="175" y="196" font-size="12" fill="#1a1a1a">8.0 m</text>

  <!-- NOT TO SCALE -->
  <text x="285" y="140" font-size="11" fill="#555">NOT TO</text>
  <text x="288" y="154" font-size="11" fill="#555">SCALE</text>
</svg>
