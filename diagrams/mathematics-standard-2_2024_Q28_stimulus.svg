<svg viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg" style="background:white;font-family:Arial,sans-serif;">
  <!-- Parallel box plots: Garden A and Garden B, scale 140-185 mm -->
  <!-- Scale: 140=50px, 185=450px => 1mm = 400/45 ≈ 8.89px -->
  <!-- px = 50 + (val-140)*8.89 -->

  <!-- Garden A: min=142, Q1=149, med=157, Q3=165, max=183 -->
  <!-- Garden B: min=141, Q1=143, med=147, Q3=160, max=173 -->
  <!-- Reading from image: -->
  <!-- Garden A: min≈142, Q1≈149, med≈157, Q3≈165, max≈183 -->
  <!-- Garden B: min≈141, Q1=143, med=147, Q3=160, max=173 -->
  <!-- Let me use values that match what I saw: -->
  <!-- Garden A: whisker left=142, box left=149, median=157, box right=165, whisker right=183 -->
  <!-- Garden B: whisker left=141, box left=143, median=147, box right=160, whisker right=173 -->

  <!-- Pixel mapping: px = 50 + (val-140)*8.0 (approx) -->
  <!-- 140→50, 145→90, 150→130, 155→170, 160→210, 165→250, 170→290, 175→330, 180→370, 185→410 -->
  <!-- Actually let me adjust: 140=55px, 185=455px => scale = 400/45 = 8.89 -->

  <defs>
    <style>
      .axis-label { font-size: 12px; fill: #1a1a1a; }
      .plot-label { font-size: 13px; fill: #1a1a1a; font-style: italic; }
    </style>
  </defs>

  <!-- Scale values to px: f(v) = 55 + (v-140)*8.89 -->
  <!-- 140=55, 145=99.4, 150=143.9, 155=188.3, 160=232.8, 165=277.2, 170=321.7, 175=366.1, 180=410.6, 185=455 -->

  <!-- X-axis line -->
  <line x1="40" y1="160" x2="465" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Arrow at end -->
  <polygon points="465,160 458,156 458,164" fill="#1a1a1a"/>

  <!-- Tick marks and labels -->
  <line x1="55" y1="155" x2="55" y2="165" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="48" y="177" class="axis-label">140</text>
  <line x1="99" y1="155" x2="99" y2="165" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="92" y="177" class="axis-label">145</text>
  <line x1="144" y1="155" x2="144" y2="165" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="137" y="177" class="axis-label">150</text>
  <line x1="188" y1="155" x2="188" y2="165" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="181" y="177" class="axis-label">155</text>
  <line x1="233" y1="155" x2="233" y2="165" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="226" y="177" class="axis-label">160</text>
  <line x1="277" y1="155" x2="277" y2="165" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="270" y="177" class="axis-label">165</text>
  <line x1="322" y1="155" x2="322" y2="165" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="315" y="177" class="axis-label">170</text>
  <line x1="366" y1="155" x2="366" y2="165" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="359" y="177" class="axis-label">175</text>
  <line x1="411" y1="155" x2="411" y2="165" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="404" y="177" class="axis-label">180</text>
  <line x1="455" y1="155" x2="455" y2="165" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="448" y="177" class="axis-label">185</text>

  <!-- Garden A (top box plot, y-centre=60) -->
  <!-- min=142→72.6, Q1=149→135.4, med=157→206.3, Q3=165→277.2, max=183→392.4 -->
  <!-- Whisker left -->
  <line x1="73" y1="60" x2="135" y2="60" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="73" y1="54" x2="73" y2="66" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Box Q1 to Q3 -->
  <rect x="135" y="44" width="142" height="32" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Median line -->
  <line x1="206" y1="44" x2="206" y2="76" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Whisker right -->
  <line x1="277" y1="60" x2="392" y2="60" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="392" y1="54" x2="392" y2="66" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Label -->
  <text x="5" y="65" class="plot-label">Garden A</text>

  <!-- Garden B (bottom box plot, y-centre=115) -->
  <!-- min=141→64, Q1=143→81.8, med=147→117.3, Q3=160→232.8, max=173→321.7 -->
  <line x1="64" y1="115" x2="82" y2="115" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="64" y1="109" x2="64" y2="121" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="82" y="99" width="151" height="32" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="117" y1="99" x2="117" y2="131" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="233" y1="115" x2="322" y2="115" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="322" y1="109" x2="322" y2="121" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="5" y="120" class="plot-label">Garden B</text>
</svg>
