<svg viewBox="0 0 540 280" xmlns="http://www.w3.org/2000/svg" style="background:white;font-family:Arial,sans-serif;">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 L1.5,3 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Wildlife park flow network: Source→A,D,C → E,D → Sink via E,B -->
  <!-- Nodes: Source(40,140), A(155,60), D(240,140), C(155,220), E(360,60), B(360,220), Sink(480,140) -->

  <!-- Edges with arrows -->
  <!-- Source→A: 10 -->
  <line x1="44" y1="135" x2="148" y2="65" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="70" y="90" font-size="12" fill="#1a1a1a">10</text>

  <!-- Source→D: 20 -->
  <line x1="46" y1="140" x2="232" y2="140" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="120" y="133" font-size="12" fill="#1a1a1a">20</text>

  <!-- Source→C: 10 -->
  <line x1="44" y1="145" x2="148" y2="215" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="68" y="195" font-size="12" fill="#1a1a1a">10</text>

  <!-- A→E: 15 -->
  <line x1="162" y1="60" x2="352" y2="60" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="248" y="52" font-size="12" fill="#1a1a1a">15</text>

  <!-- A→D: 10 -->
  <line x1="160" y1="68" x2="236" y2="133" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="186" y="103" font-size="12" fill="#1a1a1a">10</text>

  <!-- D→E: 10 -->
  <line x1="248" y1="134" x2="354" y2="66" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="296" y="95" font-size="12" fill="#1a1a1a">10</text>

  <!-- D→C: 10 (downward) -->
  <line x1="240" y1="148" x2="162" y2="214" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="190" y="188" font-size="12" fill="#1a1a1a">10</text>

  <!-- C→B: 10 -->
  <line x1="163" y1="220" x2="352" y2="220" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="248" y="213" font-size="12" fill="#1a1a1a">10</text>

  <!-- E→Sink: 20 -->
  <line x1="368" y1="60" x2="474" y2="134" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="415" y="88" font-size="12" fill="#1a1a1a">20</text>

  <!-- E→B: 10 -->
  <line x1="360" y1="68" x2="360" y2="212" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="364" y="145" font-size="12" fill="#1a1a1a">10</text>

  <!-- B→Sink: 20 -->
  <line x1="368" y1="220" x2="474" y2="148" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="415" y="200" font-size="12" fill="#1a1a1a">20</text>

  <!-- Nodes (circles with labels) -->
  <circle cx="40" cy="140" r="8" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="8" y="144" font-size="12" fill="#1a1a1a">Source</text>

  <circle cx="155" cy="60" r="6" fill="#1a1a1a"/>
  <text x="160" y="55" font-size="13" font-style="italic" fill="#1a1a1a">A</text>

  <circle cx="240" cy="140" r="6" fill="#1a1a1a"/>
  <text x="245" y="137" font-size="13" font-style="italic" fill="#1a1a1a">D</text>

  <circle cx="155" cy="220" r="6" fill="#1a1a1a"/>
  <text x="160" y="236" font-size="13" font-style="italic" fill="#1a1a1a">C</text>

  <circle cx="360" cy="60" r="6" fill="#1a1a1a"/>
  <text x="365" y="55" font-size="13" font-style="italic" fill="#1a1a1a">E</text>

  <circle cx="360" cy="220" r="6" fill="#1a1a1a"/>
  <text x="365" y="236" font-size="13" font-style="italic" fill="#1a1a1a">B</text>

  <circle cx="480" cy="140" r="8" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="491" y="144" font-size="12" fill="#1a1a1a">Sink</text>

  <!-- Dashed cut line (passes through Source→A, Source→D, Source→C edges) -->
  <line x1="88" y1="18" x2="88" y2="262" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4"/>
</svg>
