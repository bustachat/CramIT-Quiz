<svg viewBox="0 0 380 310" xmlns="http://www.w3.org/2000/svg" style="background:white;font-family:Arial,sans-serif;">
  <!-- Two equilateral triangles: large outer (side=12m) containing smaller inner (shaded, grassed) -->
  <!-- Outer triangle side = 9+3 = 12m on each side -->
  <!-- Inner triangle: vertices sit at 3m from each vertex of outer, along each side -->
  <!-- Outer: A(top), B(bottom-left), C(bottom-right), side=12m -->
  <!-- Inner: smaller equilateral triangle, rotated, shaded -->

  <!-- Outer triangle vertices (side=12m, scaled 1m=22px): -->
  <!-- Height of equilateral = √3/2 * 264 ≈ 228px -->
  <!-- A(190,30), B(64,258), C(316,258) -->

  <!-- Inner triangle vertices: each inner vertex is 3/12=1/4 from each outer vertex -->
  <!-- On AB: 1/4 from B = B + 0.25*(A-B) = (64+0.25*126, 258+0.25*(-228)) = (95.5, 201) ≈ (96,201) -->
  <!-- Actually: segments are 3 and 9. So from A along AB, 3m = 3/12 of side -->
  <!-- From the image: along each side, the inner vertex divides it 3:9 from the nearer corner -->
  <!-- Outer A=top, inner triangle has one vertex on side AB at 9m from A (or 3m from B) -->
  <!-- On side AB: 9/12 = 3/4 from A: point = A + 3/4*(B-A) = (190+0.75*(-126), 30+0.75*228) = (95.5,201) -->
  <!-- On side AC: 9/12 from A: point = A + 3/4*(C-A) = (190+0.75*126, 30+0.75*228) = (284.5,201) -->
  <!-- On side BC: 9/12 from B: point = B + 3/4*(C-B) = (64+0.75*252, 258) = (253,258) -->
  <!-- Wait, but the image shows the inner triangle differently - let me reconsider -->
  <!-- From image: dimension labels show 3,9 and 9,3 along the bottom side, and 9 on left side and 3 on right of inner -->
  <!-- Bottom side BC is labeled "9" then "3" (left to right), so inner vertex on BC is at 9m from B = 3m from C -->
  <!-- Left side AB is labeled "9" (from B going up 9m), so inner vertex on AB is at 9m from B = 3m from A -->
  <!-- Right side AC: labeled "9" on right, so inner vertex at 9m from A or... -->
  <!-- The image labels: left side shows "9" (near B going up), right side shows "9" (near middle), bottom shows "9" then "3" -->
  <!-- So the inner triangle vertices: -->
  <!--   On AB: 9m from B (= 3m from A): (190+3/12*(-126), 30+3/12*228) = (158.5, 87) -->
  <!--   On AC: 9m from C (= 3m from A): (190+3/12*126, 30+3/12*228) = (221.5, 87) -->
  <!--   On BC: 9m from B (= 3m from C): (64+9/12*252, 258) = (253, 258) -->
  <!-- Hmm that gives a degenerate triangle. Let me re-read the image -->

  <!-- From the image: the inner shaded triangle has -->
  <!-- Left edge of inner = the label "9" near top-left of inner -->
  <!-- Bottom of outer: "9" on left portion, "3" on right portion -->
  <!-- Left side of outer: "3" at top (small), "9" at bottom (large) from top -->
  <!-- So: from A (top): 3m down left side, from B (bottom-left): 9m up left side -->
  <!-- Inner vertex on AB at 3m from A: A + 3/12*(B-A) = (190+0.25*(-126), 30+0.25*228) = (158.5, 87) -->
  <!-- Inner vertex on BC at 9m from B: B + 9/12*(C-B) = (64+0.75*252, 258) = (253, 258) -->
  <!-- Inner vertex on CA at... from C: 3m toward A: C + 3/12*(A-C) = (316+0.25*(-126), 258+0.25*(-228)) = (284.5, 201) -->
  <!-- Let's check: is (158.5,87), (253,258), (284.5,201) an equilateral triangle? Probably not... -->

  <!-- Looking at the image again: the shaded inner triangle appears to be a proper equilateral triangle -->
  <!-- rotated slightly. Let me just use the visual from the image: -->
  <!-- - Large outer equilateral triangle -->
  <!-- - Smaller inner equilateral triangle, rotated, shaded -->
  <!-- - The inner triangle's vertices lie on the sides of the outer triangle -->
  <!-- - Each side divided 3:9 (with 3 on one side) -->

  <!-- Using approximate positions from image: inner is the medial-like triangle -->
  <!-- Inner vertices: P1=(158,87), P2=(253,258), P3=(285,200) — these won't be equilateral -->
  <!-- Actually in an equilateral triangle, connecting points that are 1/4 of the way along each side -->
  <!-- gives another equilateral triangle. The segments 3:9 = 1:3, so outer is 12m, inner divides 1:3 -->

  <!-- Let me use the exact positions: from image layout  -->
  <!-- The inner (shaded) triangle vertices appear at approx: -->
  <!-- Top-right area, middle-left area, bottom-right area -->

  <!-- Outer triangle: A(190,30), B(64,258), C(316,258) -->
  <polygon points="190,30 64,258 316,258" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Inner triangle (shaded): vertices at 3m from A along AB, 3m from C along CA, 9m from B along BC -->
  <!-- P1 on AB, 3/12 from A: (190-0.25*126, 30+0.25*228) = (158.5, 87) -->
  <!-- P2 on CA, 3/12 from C: (316-0.25*126, 258-0.25*228) = (284.5, 201) -->
  <!-- P3 on BC, 9/12 from B (=3/12 from C): (64+0.75*252, 258) = (253, 258) -->
  <polygon points="158,87 285,201 253,258" fill="#cccccc" stroke="#1a1a1a" stroke-width="1.8"/>

  <!-- Tick marks showing equal inner triangle sides -->
  <!-- Tick on left inner edge -->
  <line x1="212" y1="141" x2="220" y2="150" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="219" y1="138" x2="227" y2="147" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- Dimension labels on outer triangle sides -->
  <!-- Left side AB: 3 near top, 9 near bottom -->
  <text x="148" y="72" font-size="14" fill="#1a1a1a">3</text>
  <text x="108" y="178" font-size="14" fill="#1a1a1a">9</text>

  <!-- Bottom BC: 9 left portion, 3 right portion -->
  <text x="138" y="278" font-size="14" fill="#1a1a1a">9</text>
  <text x="274" y="278" font-size="14" fill="#1a1a1a">3</text>

  <!-- Right side CA: 9 upper portion -->
  <text x="262" y="140" font-size="14" fill="#1a1a1a">9</text>
  <!-- 3 at bottom of right side near C -->
  <text x="304" y="245" font-size="14" fill="#1a1a1a">3</text>

  <!-- NOT TO SCALE -->
  <text x="290" y="155" font-size="11" fill="#555">NOT TO</text>
  <text x="293" y="169" font-size="11" fill="#555">SCALE</text>
</svg>
