<svg viewBox="0 0 440 300" xmlns="http://www.w3.org/2000/svg" style="background:white;font-family:Arial,sans-serif;">
  <!-- Two vertical flagpoles BE and CD on sloping ground -->
  <!-- A at bottom-left (27°), slope goes up to right -->
  <!-- Line from A at 27° to slope: AB is along ground slope -->
  <!-- B is base of left flagpole on slope -->
  <!-- E is top of left flagpole (vertical above B) -->
  <!-- C is base of right flagpole, 20m horizontal from B -->
  <!-- D is top of right flagpole (vertical above C) -->
  <!-- X is a point on BE (somewhere mid-flagpole) -->
  <!-- angle ABX = 106° (angle at B in triangle AXB, inside slope) -->
  <!-- 53.8m is the distance AX (hypotenuse from A to X) -->
  <!-- horizontal distance E to D = 20m (top of both poles) -->

  <!-- Layout: slope rises from left to right -->
  <!-- A at (40, 250), slope angle 27° -->
  <!-- B on slope, base of left pole: (200, 175) approx -->
  <!-- C further right on slope: (300, 145) approx -->
  <!-- Flagpoles are vertical (straight up) -->

  <!-- Slope hatch region -->
  <polygon points="40,250 400,250 400,140 290,160 195,188 40,250" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Hatch lines for slope -->
  <line x1="80" y1="250" x2="100" y2="240" stroke="#1a1a1a" stroke-width="0.8"/>
  <line x1="120" y1="250" x2="145" y2="238" stroke="#1a1a1a" stroke-width="0.8"/>
  <line x1="160" y1="250" x2="190" y2="238" stroke="#1a1a1a" stroke-width="0.8"/>
  <line x1="200" y1="250" x2="235" y2="238" stroke="#1a1a1a" stroke-width="0.8"/>
  <line x1="240" y1="250" x2="278" y2="238" stroke="#1a1a1a" stroke-width="0.8"/>
  <line x1="280" y1="250" x2="318" y2="238" stroke="#1a1a1a" stroke-width="0.8"/>
  <line x1="320" y1="250" x2="358" y2="238" stroke="#1a1a1a" stroke-width="0.8"/>
  <line x1="360" y1="250" x2="398" y2="237" stroke="#1a1a1a" stroke-width="0.8"/>

  <!-- Slope top line -->
  <line x1="40" y1="250" x2="400" y2="178" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- B at (200, 212) on slope line: y = 250 - (200-40)*tan(27°) ≈ 250 - 160*0.51 ≈ 168 -->
  <!-- Let me place B at (200, 168) and C at (300, 117) -->
  <!-- Slope: y = 250 - (x-40)*tan(27°)/1 in SVG coords. But scale: let's say slope rises 72px over 360px -->
  <!-- B at x=195: y = 250 - (195-40)*0.2 ≈ 250-31 = 219? Too shallow. -->
  <!-- Let me just place B at (200,190) and C at (295,163) for visual -->

  <!-- Left flagpole BE: vertical from B(200,190) to E(200,95) -->
  <line x1="200" y1="190" x2="200" y2="70" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Right flagpole CD: vertical from C(295,163) to D(295,68) -->
  <line x1="295" y1="163" x2="295" y2="68" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Horizontal distance label E to D (20m at top) -->
  <line x1="200" y1="55" x2="295" y2="55" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="200" y1="50" x2="200" y2="60" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="295" y1="50" x2="295" y2="60" stroke="#1a1a1a" stroke-width="1"/>
  <text x="222" y="48" font-size="12" fill="#1a1a1a">←20 m→</text>

  <!-- Line from A to X on flagpole BE (53.8m, at angle through X on BE) -->
  <!-- X is on BE, midpoint ~(200,130) -->
  <line x1="40" y1="250" x2="200" y2="130" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- 53.8m label on line AX -->
  <text x="95" y="182" font-size="12" fill="#1a1a1a">53.8 m</text>

  <!-- Angle at A (27°) -->
  <path d="M 65,250 A 25,25 0 0 1 57,228" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="60" y="246" font-size="12" fill="#1a1a1a">27°</text>

  <!-- Angle at B (106°) -->
  <path d="M 200,215 A 20,20 0 0 0 185,200" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="175" y="213" font-size="12" fill="#1a1a1a">106°</text>

  <!-- Labels -->
  <text x="28" y="258" font-size="14" font-style="italic" fill="#1a1a1a">A</text>
  <text x="202" y="206" font-size="13" font-style="italic" fill="#1a1a1a">B</text>
  <text x="198" y="65" font-size="13" font-style="italic" fill="#1a1a1a">E</text>
  <text x="297" y="63" font-size="13" font-style="italic" fill="#1a1a1a">D</text>
  <text x="297" y="178" font-size="13" font-style="italic" fill="#1a1a1a">C</text>
  <!-- X label on the flagpole -->
  <text x="204" y="134" font-size="13" font-style="italic" fill="#1a1a1a">X</text>

  <!-- Dashed horizontal from B to C (ground level reference) -->
  <line x1="200" y1="190" x2="295" y2="190" stroke="#1a1a1a" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- NOT TO SCALE -->
  <text x="340" y="100" font-size="11" fill="#555">NOT TO</text>
  <text x="343" y="114" font-size="11" fill="#555">SCALE</text>
</svg>
