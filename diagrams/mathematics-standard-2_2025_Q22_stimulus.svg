<svg viewBox="0 0 560 290" xmlns="http://www.w3.org/2000/svg" style="background:white;font-family:Arial,sans-serif;">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 L1.5,3 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <!-- Pipe capacity network with cut -->
  <!-- Nodes: A(source)=left, B=upper-mid, C=lower-mid, D=upper-right, E=mid-right, F=lower-right, G=sink -->
  <!-- A(50,145), B(185,70), C(185,220), D(330,55), E(330,165), F(330,245), G(475,145) -->

  <!-- Edges -->
  <!-- A→B: 24 -->
  <line x1="55" y1="138" x2="178" y2="76" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="88" y="96" font-size="12" fill="#1a1a1a">24</text>

  <!-- A→C: 35 -->
  <line x1="55" y1="152" x2="178" y2="214" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="84" y="200" font-size="12" fill="#1a1a1a">35</text>

  <!-- B→C: 14 (downward) -->
  <line x1="185" y1="78" x2="185" y2="211" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="190" y="148" font-size="12" fill="#1a1a1a">14</text>

  <!-- B→D: 26 -->
  <line x1="192" y1="67" x2="322" y2="57" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="248" y="55" font-size="12" fill="#1a1a1a">26</text>

  <!-- C→E: 17 -->
  <line x1="192" y1="218" x2="322" y2="170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="240" y="205" font-size="12" fill="#1a1a1a">17</text>

  <!-- D→E: 8 (downward) -->
  <line x1="330" y1="63" x2="330" y2="157" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="335" y="112" font-size="12" fill="#1a1a1a">8</text>

  <!-- D→G: 15 -->
  <line x1="338" y1="57" x2="468" y2="137" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="390" y="85" font-size="12" fill="#1a1a1a">15</text>

  <!-- E→G: 24 -->
  <line x1="338" y1="165" x2="468" y2="148" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="390" y="150" font-size="12" fill="#1a1a1a">24</text>

  <!-- E→F: 6 (downward) -->
  <line x1="330" y1="173" x2="330" y2="237" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="335" y="210" font-size="12" fill="#1a1a1a">6</text>

  <!-- C→F: 12 -->
  <line x1="192" y1="224" x2="322" y2="244" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="248" y="242" font-size="12" fill="#1a1a1a">12</text>

  <!-- F→G: 11 -->
  <line x1="338" y1="243" x2="468" y2="153" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="393" y="215" font-size="12" fill="#1a1a1a">11</text>

  <!-- Nodes -->
  <circle cx="50" cy="145" r="7" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="22" y="150" font-size="14" font-style="italic" fill="#1a1a1a">A</text>

  <circle cx="185" cy="70" r="6" fill="#1a1a1a"/>
  <text x="187" y="60" font-size="14" font-style="italic" fill="#1a1a1a">B</text>

  <circle cx="185" cy="220" r="6" fill="#1a1a1a"/>
  <text x="187" y="240" font-size="14" font-style="italic" fill="#1a1a1a">C</text>

  <circle cx="330" cy="55" r="6" fill="#1a1a1a"/>
  <text x="334" y="45" font-size="14" font-style="italic" fill="#1a1a1a">D</text>

  <circle cx="330" cy="165" r="6" fill="#1a1a1a"/>
  <text x="337" y="165" font-size="14" font-style="italic" fill="#1a1a1a">E</text>

  <circle cx="330" cy="245" r="6" fill="#1a1a1a"/>
  <text x="337" y="260" font-size="14" font-style="italic" fill="#1a1a1a">F</text>

  <circle cx="475" cy="145" r="7" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="484" y="150" font-size="14" font-style="italic" fill="#1a1a1a">G</text>

  <!-- Cut line (between D,E,F and G — cuts edges D→G, E→G, F→G) -->
  <line x1="415" y1="18" x2="415" y2="272" stroke="#555" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="404" y="282" font-size="12" fill="#555">Cut</text>
</svg>
