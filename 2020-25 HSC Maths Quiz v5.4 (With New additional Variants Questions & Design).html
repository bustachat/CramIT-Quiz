// --- S1S2-12 VARIANTS: Normal distribution with mean=SD ---
// Original (2025): mean=SD → P(X>0)=P(Z>-1)=84% (answer=3)
{year:2025,category:'S1S2',variant:true,q:"Minimum daily temperature is normally distributed with mean equal to twice the standard deviation. What percentage of days have a minimum temperature above 0°C?",options:["16%","50%","68%","97.5%"],answer:3,solution:`<div class="step"><span class="step-number">1.</span> Let mean = μ and standard deviation = σ.</div>
<div class="step"><span class="step-number">2.</span> Given: μ = 2σ.</div>
<div class="step"><span class="step-number">3.</span> Find P(X > 0): convert 0 to a z-score.</div>
<div class="step"><span class="step-number">4.</span> z = (0 − μ)/σ = (0 − 2σ)/σ = −2.</div>
<div class="step"><span class="step-number">5.</span> P(X > 0) = P(Z > −2).</div>
<div class="step"><span class="step-number">6.</span> By symmetry: P(Z > −2) = P(Z < 2).</div>
<div class="step"><span class="step-number">7.</span> From the 68-95-99.7 rule: P(Z < 2) = 97.5%.</div>
<div class="step"><span class="step-number">8.</span> Option A (16%) = P(Z < −1) — that's the case when μ = σ.</div>
<div class="step"><span class="step-number">9.</span> Here μ = 2σ pushes 0°C further into the left tail (z = −2 not −1).</div>
<div class="step"><span class="step-number">10.</span> Correct: 97.5%.</div>`},

{year:2025,category:'S1S2',variant:true,q:"Minimum daily temperature is normally distributed with mean equal to the standard deviation. What percentage of days have a minimum temperature BELOW 0°C?",options:["16%","50%","68%","84%"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> Let mean = μ and standard deviation = σ.</div>
<div class="step"><span class="step-number">2.</span> Given: μ = σ.</div>
<div class="step"><span class="step-number">3.</span> Find P(X < 0): convert 0 to a z-score.</div>
<div class="step"><span class="step-number">4.</span> z = (0 − μ)/σ = (0 − σ)/σ = −1.</div>
<div class="step"><span class="step-number">5.</span> P(X < 0) = P(Z < −1).</div>
<div class="step"><span class="step-number">6.</span> From the 68-95-99.7 rule: 68% of scores lie between z = −1 and z = 1.</div>
<div class="step"><span class="step-number">7.</span> So 32% lies outside this range. By symmetry, 16% is below z = −1.</div>
<div class="step"><span class="step-number">8.</span> P(Z < −1) = 16%.</div>
<div class="step"><span class="step-number">9.</span> Option D (84%) = P(Z < 1) = P(X < 2μ) — confuses above and below.</div>
<div class="step"><span class="step-number">10.</span> Correct: 16%.</div>`},

{year:2025,category:'S1S2',variant:true,q:"Minimum daily temperature is normally distributed with mean equal to the standard deviation. What percentage of days have temperature between 0°C and twice the mean?",options:["16%","50%","68%","84%"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> Let mean = μ and standard deviation = σ, with μ = σ.</div>
<div class="step"><span class="step-number">2.</span> Convert both boundaries to z-scores.</div>
<div class="step"><span class="step-number">3.</span> Lower boundary: X = 0. z = (0 − μ)/σ = −μ/σ = −σ/σ = −1.</div>
<div class="step"><span class="step-number">4.</span> Upper boundary: X = 2μ. z = (2μ − μ)/σ = μ/σ = σ/σ = 1.</div>
<div class="step"><span class="step-number">5.</span> We need P(−1 < Z < 1).</div>
<div class="step"><span class="step-number">6.</span> From the 68-95-99.7 rule: 68% of scores lie between z = −1 and z = 1.</div>
<div class="step"><span class="step-number">7.</span> P(−1 < Z < 1) = 68%.</div>
<div class="step"><span class="step-number">8.</span> Option D (84%) = P(Z < 1) — that's the one-sided probability, not the between.</div>
<div class="step"><span class="step-number">9.</span> The 68% rule is exactly the middle ±1 SD of the distribution.</div>
<div class="step"><span class="step-number">10.</span> Correct: 68%.</div>`},

<div class="step"><span class="step-number">8.</span> Option A (8 days): 6 × 8 = 48 ≠ 108.</div>
<div class="step"><span class="step-number">9.</span> When workers decrease, time increases proportionally.</div>

<div class="step"><span class="step-number">5.</span> Alternatively: model = actual × (1/25) = 0.8/25 = 0.032 m = 3.2 cm.</div>
<div class="step"><span class="step-number">6.</span> Option D (20 cm): 20 × 25 = 500 cm = 5 m — not 0.8 m.</div>
<div class="step"><span class="step-number">7.</span> Option A (0.32 cm): divides by 250, not 25.</div>
<div class="step"><span class="step-number">8.</span> Always convert actual length to centimetres first.</div>
<div class="step"><span class="step-number">9.</span> Divide the actual cm measurement by the scale denominator.</div>
<div class="step"><span class="step-number">10.</span> Correct: 3.2 cm.</div>`},

{year:2025,category:'T2',variant:true,q:"A scale model of a bridge is built at 1:200. The actual bridge is 15 m long. What is the model length in cm?",options:["0.75","7.5","75","750"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Scale 1:200 means the model is 1/200 the size of the actual bridge.</div>
<div class="step"><span class="step-number">2.</span> Actual length = 15 m = 1500 cm.</div>
<div class="step"><span class="step-number">3.</span> Model length = 1500 cm ÷ 200.</div>
<div class="step"><span class="step-number">4.</span> Model length = 7.5 cm.</div>
<div class="step"><span class="step-number">5.</span> Alternatively: model = actual × (1/200) = 15/200 = 0.075 m = 7.5 cm.</div>
<div class="step"><span class="step-number">6.</span> Option C (75 cm): 75 × 200 = 15,000 cm = 150 m — much too large.</div>
<div class="step"><span class="step-number">7.</span> Option A (0.75 cm): divides by 2000, not 200.</div>
<div class="step"><span class="step-number">8.</span> Always convert actual length to centimetres first.</div>
<div class="step"><span class="step-number">9.</span> Divide the actual cm measurement by the scale denominator.</div>
<div class="step"><span class="step-number">10.</span> Correct: 7.5 cm.</div>`},

// --- T2-11 VARIANTS: Inverse variation with surface area ---
// Original (2025): r doubles → SA×4 → thickness÷4 (answer=2)
{year:2025,category:'T2',variant:true,q:"A balloon's skin thickness varies inversely with its surface area. If the radius of the balloon triples, what happens to the thickness?",options:["Divided by 3","Multiplied by 3","Divided by 9","Multiplied by 9"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> Surface area of a sphere: SA = 4πr².</div>
<div class="step"><span class="step-number">2.</span> If radius triples (r → 3r), new SA = 4π(3r)² = 4π × 9r² = 9 × original SA.</div>
<div class="step"><span class="step-number">3.</span> Surface area increases by a factor of 9.</div>
<div class="step"><span class="step-number">4.</span> Thickness varies inversely with surface area.</div>
<div class="step"><span class="step-number">5.</span> Inversely means: if SA × 9, then thickness ÷ 9.</div>
<div class="step"><span class="step-number">6.</span> New thickness = original thickness ÷ 9.</div>
<div class="step"><span class="step-number">7.</span> Option A (÷3): confuses linear and quadratic scaling.</div>
<div class="step"><span class="step-number">8.</span> The key is that surface area scales with r², not r.</div>
<div class="step"><span class="step-number">9.</span> Tripling the radius increases SA by 3² = 9 times.</div>
<div class="step"><span class="step-number">10.</span> Correct: Divided by 9.</div>`},

{year:2025,category:'T2',variant:true,q:"A balloon's skin thickness varies inversely with its surface area. If the radius of the balloon is halved, what happens to the thickness?",options:["Divided by 4","Divided by 2","Multiplied by 2","Multiplied by 4"],answer:3,solution:`<div class="step"><span class="step-number">1.</span> Surface area of a sphere: SA = 4πr².</div>
<div class="step"><span class="step-number">2.</span> If radius is halved (r → r/2), new SA = 4π(r/2)² = 4π × r²/4 = (1/4) × original SA.</div>
<div class="step"><span class="step-number">3.</span> Surface area decreases by a factor of 4.</div>
<div class="step"><span class="step-number">4.</span> Thickness varies inversely with surface area.</div>
<div class="step"><span class="step-number">5.</span> Inversely means: if SA ÷ 4, then thickness × 4.</div>
<div class="step"><span class="step-number">6.</span> New thickness = original thickness × 4.</div>
<div class="step"><span class="step-number">7.</span> Option C (×2): confuses linear and quadratic scaling.</div>
<div class="step"><span class="step-number">8.</span> The key is that surface area scales with r², not r.</div>
<div class="step"><span class="step-number">9.</span> Halving the radius decreases SA by (1/2)² = 1/4, so thickness ×4.</div>
<div class="step"><span class="step-number">10.</span> Correct: Multiplied by 4.</div>`},

{year:2025,category:'T2',variant:true,q:"The volume of a cube varies directly with the cube of its side length. If the side length doubles, by what factor does the volume increase?",options:["2","4","6","8"],answer:3,solution:`<div class="step"><span class="step-number">1.</span> Volume of a cube: V = s³.</div>
<div class="step"><span class="step-number">2.</span> If side doubles (s → 2s), new volume = (2s)³ = 8s³.</div>
<div class="step"><span class="step-number">3.</span> New volume = 8 × original volume.</div>
<div class="step"><span class="step-number">4.</span> Volume increases by a factor of 8.</div>
<div class="step"><span class="step-number">5.</span> Option A (2): linear scaling — only applies to 1D measurements.</div>
<div class="step"><span class="step-number">6.</span> Option B (4): quadratic scaling — applies to area, not volume.</div>
<div class="step"><span class="step-number">7.</span> Volume is a 3D measure, so doubling each dimension multiplies volume by 2³ = 8.</div>
<div class="step"><span class="step-number">8.</span> Check: if s=3, V=27. If s=6, V=216 = 8×27. ✓</div>
<div class="step"><span class="step-number">9.</span> Direct variation with s³ means V ∝ s³.</div>
<div class="step"><span class="step-number">10.</span> Correct: 8.</div>`},

// --- A2-1 VARIANTS: Identify graph of quadratic ---
// Original (2020): y=−x²+1 → opens down, vertex (0,1) (answer=2)
{year:2020,category:'A2',variant:true,q:"Which of the following could represent the graph of y = −x² − 3?",options:["Parabola opening upward, y-intercept at 3","Parabola opening upward, y-intercept at −3","Parabola opening downward, vertex at (0,−3)","Parabola opening downward, vertex at (−3,0)"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> The equation is y = −x² − 3.</div>
<div class="step"><span class="step-number">2.</span> The coefficient of x² is −1 (negative).</div>
<div class="step"><span class="step-number">3.</span> Negative coefficient → parabola opens downward.</div>
<div class="step"><span class="step-number">4.</span> Options A and B open upward — eliminate these.</div>
<div class="step"><span class="step-number">5.</span> To find the vertex: y = −x² − 3 is in the form y = a(x−h)² + k.</div>
<div class="step"><span class="step-number">6.</span> Here h = 0, k = −3, so vertex is at (0, −3).</div>
<div class="step"><span class="step-number">7.</span> The y-intercept (x=0): y = −(0)² − 3 = −3. Confirms vertex at (0,−3).</div>
<div class="step"><span class="step-number">8.</span> Option D says vertex at (−3, 0) — wrong coordinates.</div>
<div class="step"><span class="step-number">9.</span> The vertex is the turning point, located at (0, −3).</div>
<div class="step"><span class="step-number">10.</span> Correct: Parabola opening downward, vertex at (0, −3).</div>`},

{year:2020,category:'A2',variant:true,q:"Which of the following could represent the graph of y = x² − 2?",options:["Parabola opening downward, vertex at (0,−2)","Parabola opening upward, vertex at (0,−2)","Parabola opening upward, vertex at (0,2)","Parabola opening downward, vertex at (2,0)"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> The equation is y = x² − 2.</div>
<div class="step"><span class="step-number">2.</span> The coefficient of x² is +1 (positive).</div>
<div class="step"><span class="step-number">3.</span> Positive coefficient → parabola opens upward.</div>
<div class="step"><span class="step-number">4.</span> Options A and D open downward — eliminate these.</div>
<div class="step"><span class="step-number">5.</span> To find the vertex: y = x² − 2 is in the form y = a(x−h)² + k.</div>
<div class="step"><span class="step-number">6.</span> Here h = 0, k = −2, so vertex is at (0, −2).</div>
<div class="step"><span class="step-number">7.</span> The y-intercept (x=0): y = (0)² − 2 = −2. Confirms vertex at (0,−2).</div>
<div class="step"><span class="step-number">8.</span> Option C says vertex at (0, 2) — the constant is −2, not +2.</div>
<div class="step"><span class="step-number">9.</span> The vertex of y = x² + k is always at (0, k).</div>
<div class="step"><span class="step-number">10.</span> Correct: Parabola opening upward, vertex at (0, −2).</div>`},

{year:2020,category:'A2',variant:true,q:"Which of the following could represent the graph of y = −2x² + 4?",options:["Parabola opening upward, vertex at (0,4)","Parabola opening downward, vertex at (4,0)","Parabola opening downward, vertex at (0,4)","Parabola opening upward, vertex at (0,−4)"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> The equation is y = −2x² + 4.</div>
<div class="step"><span class="step-number">2.</span> The coefficient of x² is −2 (negative).</div>
<div class="step"><span class="step-number">3.</span> Negative coefficient → parabola opens downward.</div>
<div class="step"><span class="step-number">4.</span> Options A and D open upward — eliminate these.</div>
<div class="step"><span class="step-number">5.</span> To find the vertex: y = −2x² + 4 is in the form y = a(x−h)² + k.</div>
<div class="step"><span class="step-number">6.</span> Here h = 0, k = 4, so vertex is at (0, 4).</div>
<div class="step"><span class="step-number">7.</span> The y-intercept (x=0): y = −2(0)² + 4 = 4. Confirms vertex at (0,4).</div>
<div class="step"><span class="step-number">8.</span> Option B says vertex at (4, 0) — swaps x and y coordinates.</div>
<div class="step"><span class="step-number">9.</span> The vertex of y = ax² + k is always at (0, k).</div>
<div class="step"><span class="step-number">10.</span> Correct: Parabola opening downward, vertex at (0, 4).</div>`},

// --- A2-2 VARIANTS: Pearson correlation ---
// Original (2021): r=−1 → perfect downward line (answer=2)
{year:2021,category:'A2',variant:true,q:"For bivariate data, Pearson's correlation coefficient is +1. Which graph best represents this?",options:["Random scatter","Perfect upward line","Perfect downward line","Curved pattern"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Pearson's r measures the strength and direction of a linear relationship.</div>
<div class="step"><span class="step-number">2.</span> r = +1 means a perfect positive linear correlation.</div>
<div class="step"><span class="step-number">3.</span> All points lie exactly on a straight line with positive slope.</div>
<div class="step"><span class="step-number">4.</span> As one variable increases, the other increases perfectly.</div>
<div class="step"><span class="step-number">5.</span> Option A (random scatter): r near 0, not ±1.</div>
<div class="step"><span class="step-number">6.</span> Option C (downward line): this would be r = −1.</div>
<div class="step"><span class="step-number">7.</span> Option D (curved): r measures linear relationships only — a curve can have r near 0.</div>
<div class="step"><span class="step-number">8.</span> r = +1 is the maximum possible value (perfect positive).</div>
<div class="step"><span class="step-number">9.</span> The sign tells direction; the magnitude (1) tells perfect fit.</div>
<div class="step"><span class="step-number">10.</span> Correct: Perfect upward line.</div>`},

{year:2021,category:'A2',variant:true,q:"For bivariate data, Pearson's correlation coefficient is 0.85. Which graph best represents this?",options:["Random scatter","Strong positive trend","Strong negative trend","Perfect upward line"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Pearson's r = 0.85.</div>
<div class="step"><span class="step-number">2.</span> The positive sign means as one variable increases, the other tends to increase.</div>
<div class="step"><span class="step-number">3.</span> The magnitude 0.85 is close to 1 — strong correlation.</div>
<div class="step"><span class="step-number">4.</span> Strong positive trend with points clustered around an upward line.</div>
<div class="step"><span class="step-number">5.</span> Option A (random scatter): r near 0, much weaker than 0.85.</div>
<div class="step"><span class="step-number">6.</span> Option C (negative trend): r would be negative.</div>
<div class="step"><span class="step-number">7.</span> Option D (perfect line): requires r = 1 exactly, not 0.85.</div>
<div class="step"><span class="step-number">8.</span> r = 0.85 means strong but not perfect — some scatter around the trend.</div>
<div class="step"><span class="step-number">9.</span> Values: 0 = no correlation, ±1 = perfect correlation.</div>
<div class="step"><span class="step-number">10.</span> Correct: Strong positive trend.</div>`},

{year:2021,category:'A2',variant:true,q:"For bivariate data, Pearson's correlation coefficient is −0.3. Which graph best represents this?",options:["Weak negative trend","Strong negative trend","Perfect downward line","Strong positive trend"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> Pearson's r = −0.3.</div>
<div class="step"><span class="step-number">2.</span> The negative sign means as one variable increases, the other tends to decrease.</div>
<div class="step"><span class="step-number">3.</span> The magnitude 0.3 is small — weak correlation.</div>
<div class="step"><span class="step-number">4.</span> Weak negative trend: points scattered loosely with a slight downward trend.</div>
<div class="step"><span class="step-number">5.</span> Option B (strong negative): r near −1 (e.g. −0.9), not −0.3.</div>
<div class="step"><span class="step-number">6.</span> Option C (perfect downward): requires r = −1 exactly.</div>
<div class="step"><span class="step-number">7.</span> Option D (positive): positive r would be required.</div>
<div class="step"><span class="step-number">8.</span> r = −0.3 is a weak negative — much scatter, slight downward trend.</div>
<div class="step"><span class="step-number">9.</span> The closer |r| is to 1, the stronger and more linear the relationship.</div>
<div class="step"><span class="step-number">10.</span> Correct: Weak negative trend.</div>`},

// --- A2-3 VARIANTS: Identify exponential graph ---
// Original (2021): y=10(0.8)^x → exponential decay from 10 (answer=0)
{year:2021,category:'A2',variant:true,q:"Which graph best represents y = 5(1.3)^x?",options:["Exponential decay from 5","Exponential growth from 5","Linear growth from 5","Parabola through (0,5)"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> The equation y = 5(1.3)^x is exponential.</div>
<div class="step"><span class="step-number">2.</span> When x = 0: y = 5(1.3)⁰ = 5 × 1 = 5. So the graph starts at y = 5.</div>
<div class="step"><span class="step-number">3.</span> The base is 1.3. Since 1.3 > 1, the function is increasing.</div>
<div class="step"><span class="step-number">4.</span> As x increases, y grows exponentially (gets bigger and bigger).</div>
<div class="step"><span class="step-number">5.</span> This is exponential growth, not decay.</div>
<div class="step"><span class="step-number">6.</span> Option A (decay): would require base < 1 (e.g. 0.8).</div>
<div class="step"><span class="step-number">7.</span> Option C (linear): exponential curves, not straight lines.</div>
<div class="step"><span class="step-number">8.</span> Option D (parabola): parabolas involve x², not b^x.</div>
<div class="step"><span class="step-number">9.</span> Key rule: base > 1 → growth; base between 0 and 1 → decay.</div>
<div class="step"><span class="step-number">10.</span> Correct: Exponential growth from 5.</div>`},

{year:2021,category:'A2',variant:true,q:"Which graph best represents y = 3(0.5)^x?",options:["Exponential decay from 3","Exponential growth from 3","Linear decay from 3","Parabola through (0,3)"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> The equation y = 3(0.5)^x is exponential.</div>
<div class="step"><span class="step-number">2.</span> When x = 0: y = 3(0.5)⁰ = 3 × 1 = 3. So the graph starts at y = 3.</div>
<div class="step"><span class="step-number">3.</span> The base is 0.5. Since 0 < 0.5 < 1, the function is decreasing.</div>
<div class="step"><span class="step-number">4.</span> As x increases, y gets smaller (halves each time x increases by 1).</div>
<div class="step"><span class="step-number">5.</span> This is exponential decay.</div>
<div class="step"><span class="step-number">6.</span> Option B (growth): would require base > 1 (e.g. 1.3).</div>
<div class="step"><span class="step-number">7.</span> Option C (linear decay): exponential decay curves, doesn't go below zero, different from linear.</div>
<div class="step"><span class="step-number">8.</span> Option D (parabola): parabolas involve x², not b^x.</div>
<div class="step"><span class="step-number">9.</span> Key rule: base > 1 → growth; base between 0 and 1 → decay.</div>
<div class="step"><span class="step-number">10.</span> Correct: Exponential decay from 3.</div>`},

{year:2021,category:'A2',variant:true,q:"Which graph best represents y = 2^x?",options:["Exponential decay from 1","Exponential growth from 1","Linear growth from 0","Parabola opening upward"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> The equation y = 2^x is exponential.</div>
<div class="step"><span class="step-number">2.</span> When x = 0: y = 2⁰ = 1. So the graph passes through (0, 1).</div>
<div class="step"><span class="step-number">3.</span> The base is 2. Since 2 > 1, the function is increasing.</div>
<div class="step"><span class="step-number">4.</span> As x increases, y doubles each time: 1, 2, 4, 8, 16…</div>
<div class="step"><span class="step-number">5.</span> This is exponential growth starting from y = 1.</div>
<div class="step"><span class="step-number">6.</span> Option A (decay): would require base < 1.</div>
<div class="step"><span class="step-number">7.</span> Option C (linear): a straight line, not a curve.</div>
<div class="step"><span class="step-number">8.</span> Option D (parabola): parabolas involve x², not 2^x.</div>
<div class="step"><span class="step-number">9.</span> Note y=2^x is equivalent to y=1×(2)^x — starts at 1 when x=0.</div>
<div class="step"><span class="step-number">10.</span> Correct: Exponential growth from 1.</div>`},

// --- A2-4 VARIANTS: Identify linear graph ---
// Original (2022): y=−2x+2 → neg slope, y-int at 2 (answer=1)
{year:2022,category:'A2',variant:true,q:"Which could be the graph of y = 3x − 4?",options:["Line with negative slope through (0,−4)","Line with positive slope through (0,−4)","Line with positive slope through (0,4)","Horizontal line at y=−4"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> The equation y = 3x − 4 is in slope-intercept form y = mx + b.</div>
<div class="step"><span class="step-number">2.</span> Slope m = 3 (positive).</div>
<div class="step"><span class="step-number">3.</span> Positive slope → line goes upward from left to right.</div>
<div class="step"><span class="step-number">4.</span> y-intercept b = −4.</div>
<div class="step"><span class="step-number">5.</span> When x = 0: y = 3(0) − 4 = −4. So the line passes through (0, −4).</div>
<div class="step"><span class="step-number">6.</span> Option A has negative slope — wrong sign.</div>
<div class="step"><span class="step-number">7.</span> Option C has y-intercept +4, not −4.</div>
<div class="step"><span class="step-number">8.</span> Option D is horizontal (slope = 0), not slope = 3.</div>
<div class="step"><span class="step-number">9.</span> We need positive slope AND y-intercept at −4.</div>
<div class="step"><span class="step-number">10.</span> Correct: Line with positive slope through (0, −4).</div>`},

{year:2022,category:'A2',variant:true,q:"Which could be the graph of y = −x + 5?",options:["Line with positive slope through (0,5)","Line with negative slope through (0,5)","Line with negative slope through (5,0)","Horizontal line at y=5"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> The equation y = −x + 5 is in slope-intercept form y = mx + b.</div>
<div class="step"><span class="step-number">2.</span> Slope m = −1 (negative).</div>
<div class="step"><span class="step-number">3.</span> Negative slope → line goes downward from left to right.</div>
<div class="step"><span class="step-number">4.</span> y-intercept b = 5.</div>
<div class="step"><span class="step-number">5.</span> When x = 0: y = −(0) + 5 = 5. So the line passes through (0, 5).</div>
<div class="step"><span class="step-number">6.</span> Option A has positive slope — wrong sign.</div>
<div class="step"><span class="step-number">7.</span> Option C passes through (5, 0) not (0, 5) — confuses x and y intercepts.</div>
<div class="step"><span class="step-number">8.</span> Option D is horizontal (slope = 0), not slope = −1.</div>
<div class="step"><span class="step-number">9.</span> We need negative slope AND y-intercept at 5.</div>
<div class="step"><span class="step-number">10.</span> Correct: Line with negative slope through (0, 5).</div>`},

{year:2022,category:'A2',variant:true,q:"Which could be the graph of y = 4x?",options:["Line with positive slope through (0,4)","Line with negative slope through (0,0)","Line with positive slope through (0,0)","Horizontal line at y=4"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> The equation y = 4x is in slope-intercept form y = mx + b.</div>
<div class="step"><span class="step-number">2.</span> Slope m = 4 (positive).</div>
<div class="step"><span class="step-number">3.</span> Positive slope → line goes upward from left to right.</div>
<div class="step"><span class="step-number">4.</span> y-intercept b = 0 (no constant term).</div>
<div class="step"><span class="step-number">5.</span> When x = 0: y = 4(0) = 0. So the line passes through the origin (0, 0).</div>
<div class="step"><span class="step-number">6.</span> Option A passes through (0, 4) — that would be y = 4x + 4.</div>
<div class="step"><span class="step-number">7.</span> Option B has negative slope — wrong sign.</div>
<div class="step"><span class="step-number">8.</span> Option D is horizontal — slope = 0, not 4.</div>
<div class="step"><span class="step-number">9.</span> y = 4x passes through the origin with steep positive slope.</div>
<div class="step"><span class="step-number">10.</span> Correct: Line with positive slope through (0, 0).</div>`},

// --- A2-5 VARIANTS: Projectile time at height ---
// Original (2023): h=−5t²+80t≥300 → 6≤t≤10 → 4 seconds (answer=0)
{year:2023,category:'A2',variant:true,q:"An object is projected: h = −4t² + 64t. For how long is it at 240 m or more?",options:["4 seconds","5 seconds","6 seconds","8 seconds"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> Set up the inequality: −4t² + 64t ≥ 240.</div>
<div class="step"><span class="step-number">2.</span> Rearrange: −4t² + 64t − 240 ≥ 0.</div>
<div class="step"><span class="step-number">3.</span> Divide by −4 (flip inequality): t² − 16t + 60 ≤ 0.</div>
<div class="step"><span class="step-number">4.</span> Factorise: (t − 6)(t − 10) ≤ 0.</div>
<div class="step"><span class="step-number">5.</span> This inequality holds when 6 ≤ t ≤ 10.</div>
<div class="step"><span class="step-number">6.</span> Duration = 10 − 6 = 4 seconds.</div>
<div class="step"><span class="step-number">7.</span> Check at t=6: h = −4(36) + 64(6) = −144 + 384 = 240 ✓</div>
<div class="step"><span class="step-number">8.</span> Check at t=10: h = −4(100) + 64(10) = −400 + 640 = 240 ✓</div>
<div class="step"><span class="step-number">9.</span> Check at t=8 (midpoint): h = −4(64)+64(8) = −256+512 = 256 ≥ 240 ✓</div>
<div class="step"><span class="step-number">10.</span> Correct: 4 seconds.</div>`},

{year:2023,category:'A2',variant:true,q:"An object is projected: h = −5t² + 60t. For how long is it at 175 m or more?",options:["2 seconds","4 seconds","5 seconds","6 seconds"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> Set up the inequality: −5t² + 60t ≥ 175.</div>
<div class="step"><span class="step-number">2.</span> Rearrange: −5t² + 60t − 175 ≥ 0.</div>
<div class="step"><span class="step-number">3.</span> Divide by −5 (flip inequality): t² − 12t + 35 ≤ 0.</div>
<div class="step"><span class="step-number">4.</span> Factorise: (t − 5)(t − 7) ≤ 0.</div>
<div class="step"><span class="step-number">5.</span> This inequality holds when 5 ≤ t ≤ 7.</div>
<div class="step"><span class="step-number">6.</span> Duration = 7 − 5 = 2 seconds.</div>
<div class="step"><span class="step-number">7.</span> Check at t=5: h = −5(25) + 60(5) = −125 + 300 = 175 ✓</div>
<div class="step"><span class="step-number">8.</span> Check at t=7: h = −5(49) + 60(7) = −245 + 420 = 175 ✓</div>
<div class="step"><span class="step-number">9.</span> Check at t=6 (midpoint): h = −5(36)+360 = −180+360 = 180 ≥ 175 ✓</div>
<div class="step"><span class="step-number">10.</span> Correct: 2 seconds.</div>`},

{year:2023,category:'A2',variant:true,q:"An object is projected: h = −5t² + 75t. For how long is it at 250 m or more?",options:["4 seconds","5 seconds","6 seconds","8 seconds"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Set up the inequality: −5t² + 75t ≥ 250.</div>
<div class="step"><span class="step-number">2.</span> Rearrange: −5t² + 75t − 250 ≥ 0.</div>
<div class="step"><span class="step-number">3.</span> Divide by −5 (flip inequality): t² − 15t + 50 ≤ 0.</div>
<div class="step"><span class="step-number">4.</span> Factorise: (t − 5)(t − 10) ≤ 0.</div>
<div class="step"><span class="step-number">5.</span> This inequality holds when 5 ≤ t ≤ 10.</div>
<div class="step"><span class="step-number">6.</span> Duration = 10 − 5 = 5 seconds.</div>
<div class="step"><span class="step-number">7.</span> Check at t=5: h = −5(25) + 75(5) = −125 + 375 = 250 ✓</div>
<div class="step"><span class="step-number">8.</span> Check at t=10: h = −5(100) + 75(10) = −500 + 750 = 250 ✓</div>
<div class="step"><span class="step-number">9.</span> Check at t=7.5 (midpoint): h = −5(56.25)+562.5 = −281.25+562.5 = 281.25 ≥ 250 ✓</div>
<div class="step"><span class="step-number">10.</span> Correct: 5 seconds.</div>`},

// --- A2-6 VARIANTS: Regression line interpretation ---
// Original (2023): M=20+3H → at H=0, M=20 (answer=1)
{year:2023,category:'A2',variant:true,q:"A regression line W = 60 + 0.5A relates age (A, years) to weight (W, kg). Which statement is correct?",options:["Weight is 0.5 kg at age zero","Weight is 60 kg at age zero","Weight increases by 60 kg per year","Weight increases by 0.5 per 60 years"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> The regression equation is W = 60 + 0.5A.</div>
<div class="step"><span class="step-number">2.</span> This is in the form y = b + mx where b is the y-intercept and m is the slope.</div>
<div class="step"><span class="step-number">3.</span> When A = 0: W = 60 + 0.5(0) = 60 kg.</div>
<div class="step"><span class="step-number">4.</span> So at age zero, the predicted weight is 60 kg (the y-intercept).</div>
<div class="step"><span class="step-number">5.</span> The slope is 0.5, meaning weight increases by 0.5 kg per year of age.</div>
<div class="step"><span class="step-number">6.</span> Option A reverses the intercept and slope values.</div>
<div class="step"><span class="step-number">7.</span> Option C uses 60 as the rate of change — that's the intercept, not the slope.</div>
<div class="step"><span class="step-number">8.</span> Option D has the relationship backwards.</div>
<div class="step"><span class="step-number">9.</span> In W = b + mA: b = initial value, m = rate of change per unit of A.</div>
<div class="step"><span class="step-number">10.</span> Correct: Weight is 60 kg at age zero.</div>`},

{year:2023,category:'A2',variant:true,q:"A regression line C = 5 + 2.5n relates items sold (n) to total cost (C, $). Which statement is correct?",options:["Cost increases by $5 per item","Cost is $2.50 at zero items","Cost is $5 at zero items","Cost increases by $5 per 2.5 items"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> The regression equation is C = 5 + 2.5n.</div>
<div class="step"><span class="step-number">2.</span> This is in the form y = b + mx where b = 5 (intercept) and m = 2.5 (slope).</div>
<div class="step"><span class="step-number">3.</span> When n = 0: C = 5 + 2.5(0) = $5.</div>
<div class="step"><span class="step-number">4.</span> So the fixed cost (at zero items) is $5 — the intercept.</div>
<div class="step"><span class="step-number">5.</span> The slope is 2.5, meaning cost increases by $2.50 per additional item.</div>
<div class="step"><span class="step-number">6.</span> Option A says cost increases by $5 per item — that's the intercept, not the slope.</div>
<div class="step"><span class="step-number">7.</span> Option B reverses intercept and slope values.</div>
<div class="step"><span class="step-number">8.</span> Option D misreads the relationship.</div>
<div class="step"><span class="step-number">9.</span> In C = b + mn: b = fixed cost (intercept), m = variable cost per item (slope).</div>
<div class="step"><span class="step-number">10.</span> Correct: Cost is $5 at zero items.</div>`},

{year:2023,category:'A2',variant:true,q:"A regression line T = 100 − 4d relates distance driven (d, km) to time remaining in journey (T, minutes). Which statement is correct?",options:["Journey takes 4 minutes total","Journey takes 100 minutes at zero km driven","Time increases by 4 minutes per km","Time decreases by 100 minutes per km"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> The regression equation is T = 100 − 4d.</div>
<div class="step"><span class="step-number">2.</span> This is in the form y = b + md where b = 100 (intercept) and m = −4 (slope).</div>
<div class="step"><span class="step-number">3.</span> When d = 0: T = 100 − 4(0) = 100 minutes.</div>
<div class="step"><span class="step-number">4.</span> So at zero km driven, 100 minutes remain — the total journey time.</div>
<div class="step"><span class="step-number">5.</span> The slope is −4, meaning time remaining decreases by 4 minutes per km driven.</div>
<div class="step"><span class="step-number">6.</span> Option A says 4 minutes total — that's the rate per km, not the total.</div>
<div class="step"><span class="step-number">7.</span> Option C says time increases — the slope is negative, so time decreases.</div>
<div class="step"><span class="step-number">8.</span> Option D uses 100 as the rate — that's the intercept.</div>
<div class="step"><span class="step-number">9.</span> The negative slope makes sense: more km driven = less time remaining.</div>
<div class="step"><span class="step-number">10.</span> Correct: Journey takes 100 minutes at zero km driven.</div>`},

// --- A2-7 VARIANTS: Correlation coefficient sign/magnitude ---
// Original (2024): scatterplot positive trend → r closest to +0.8 (answer=3)
{year:2024,category:'A2',variant:true,q:"A scatterplot shows height versus shoe size with a strong upward trend. Which correlation coefficient best describes this?",options:["-0.9","-0.2","0.2","0.9"],answer:3,solution:`<div class="step"><span class="step-number">1.</span> The scatterplot shows a strong upward (positive) trend.</div>
<div class="step"><span class="step-number">2.</span> Positive trend → positive correlation coefficient.</div>
<div class="step"><span class="step-number">3.</span> Eliminate negative options A (−0.9) and B (−0.2).</div>
<div class="step"><span class="step-number">4.</span> Strong trend → r close to 1 (not close to 0).</div>
<div class="step"><span class="step-number">5.</span> Option C (0.2) is weak — the trend is described as strong.</div>
<div class="step"><span class="step-number">6.</span> Option D (0.9) is strong and positive — matches the description.</div>
<div class="step"><span class="step-number">7.</span> r = 0.9 means points cluster tightly around an upward line.</div>
<div class="step"><span class="step-number">8.</span> r = 0.2 would show a very weak trend (mostly scattered).</div>
<div class="step"><span class="step-number">9.</span> Sign = direction; magnitude = strength.</div>
<div class="step"><span class="step-number">10.</span> Correct: 0.9.</div>`},

{year:2024,category:'A2',variant:true,q:"A scatterplot of hours studied versus exam errors shows a moderate downward trend. Which correlation coefficient best describes this?",options:["-0.7","-0.1","0.1","0.7"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> The scatterplot shows a moderate downward (negative) trend.</div>
<div class="step"><span class="step-number">2.</span> Downward/negative trend → negative correlation coefficient.</div>
<div class="step"><span class="step-number">3.</span> Eliminate positive options C (0.1) and D (0.7).</div>
<div class="step"><span class="step-number">4.</span> Moderate trend → r not too close to 0 or −1.</div>
<div class="step"><span class="step-number">5.</span> Option B (−0.1) is very weak — the trend is described as moderate.</div>
<div class="step"><span class="step-number">6.</span> Option A (−0.7) is moderately strong and negative — matches description.</div>
<div class="step"><span class="step-number">7.</span> r = −0.7 means a clear negative trend with some scatter.</div>
<div class="step"><span class="step-number">8.</span> As hours studied increases, errors decrease — sensible relationship.</div>
<div class="step"><span class="step-number">9.</span> Sign = direction (−); magnitude (0.7) = moderate strength.</div>
<div class="step"><span class="step-number">10.</span> Correct: −0.7.</div>`},

{year:2024,category:'A2',variant:true,q:"A scatterplot of daily temperature versus ice cream sales shows a very weak positive trend. Which correlation coefficient best describes this?",options:["-0.8","-0.1","0.1","0.8"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> The scatterplot shows a very weak positive trend.</div>
<div class="step"><span class="step-number">2.</span> Positive trend → positive correlation coefficient.</div>
<div class="step"><span class="step-number">3.</span> Eliminate negative options A (−0.8) and B (−0.1).</div>
<div class="step"><span class="step-number">4.</span> Very weak trend → r close to 0 (not close to 1).</div>
<div class="step"><span class="step-number">5.</span> Option D (0.8) is strong — the trend is described as very weak.</div>
<div class="step"><span class="step-number">6.</span> Option C (0.1) is weak and positive — matches description.</div>
<div class="step"><span class="step-number">7.</span> r = 0.1 means a barely detectable positive trend with lots of scatter.</div>
<div class="step"><span class="step-number">8.</span> r = 0.8 would show a strong clear trend — not "very weak".</div>
<div class="step"><span class="step-number">9.</span> Sign = direction (+); magnitude (0.1) = very weak.</div>
<div class="step"><span class="step-number">10.</span> Correct: 0.1.</div>`},

// --- A2-8 VARIANTS: Identify equation from graph description ---
// Original (2024): neg slope through (0,3) → y=−2x+3 (answer=2)
{year:2024,category:'A2',variant:true,q:"A straight-line graph has a positive slope and passes through (0, −2). Which could be its equation?",options:["y = −3x − 2","y = −3x + 2","y = 3x − 2","y = 3x + 2"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> The graph has a positive slope.</div>
<div class="step"><span class="step-number">2.</span> Positive slope → coefficient of x must be positive.</div>
<div class="step"><span class="step-number">3.</span> Eliminate options A and B (coefficient of x is −3, negative slope).</div>
<div class="step"><span class="step-number">4.</span> The y-intercept is at (0, −2), meaning the constant term is −2.</div>
<div class="step"><span class="step-number">5.</span> Check option C: y = 3x − 2. At x=0: y = −2. ✓ Slope = +3. ✓</div>
<div class="step"><span class="step-number">6.</span> Check option D: y = 3x + 2. At x=0: y = +2. ✗ (should be −2)</div>
<div class="step"><span class="step-number">7.</span> Option C matches both conditions: positive slope AND passes through (0, −2).</div>
<div class="step"><span class="step-number">8.</span> The y-intercept is the constant in y = mx + b.</div>
<div class="step"><span class="step-number">9.</span> The slope sign must match the graph's direction.</div>
<div class="step"><span class="step-number">10.</span> Correct: y = 3x − 2.</div>`},

{year:2024,category:'A2',variant:true,q:"A straight-line graph has a negative slope and passes through (0, −4). Which could be its equation?",options:["y = −5x − 4","y = 5x − 4","y = −5x + 4","y = 5x + 4"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> The graph has a negative slope.</div>
<div class="step"><span class="step-number">2.</span> Negative slope → coefficient of x must be negative.</div>
<div class="step"><span class="step-number">3.</span> Eliminate options B and D (coefficient of x is +5, positive slope).</div>
<div class="step"><span class="step-number">4.</span> The y-intercept is at (0, −4), meaning the constant term is −4.</div>
<div class="step"><span class="step-number">5.</span> Check option A: y = −5x − 4. At x=0: y = −4. ✓ Slope = −5. ✓</div>
<div class="step"><span class="step-number">6.</span> Check option C: y = −5x + 4. At x=0: y = +4. ✗ (should be −4)</div>
<div class="step"><span class="step-number">7.</span> Option A matches both conditions: negative slope AND passes through (0, −4).</div>
<div class="step"><span class="step-number">8.</span> The y-intercept is the constant in y = mx + b.</div>
<div class="step"><span class="step-number">9.</span> The slope sign must match the graph's direction.</div>
<div class="step"><span class="step-number">10.</span> Correct: y = −5x − 4.</div>`},

{year:2024,category:'A2',variant:true,q:"A straight-line graph passes through the origin and has a negative slope. Which could be its equation?",options:["y = 2x","y = 2x + 1","y = −2x","y = −2x + 1"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> The graph passes through the origin (0, 0).</div>
<div class="step"><span class="step-number">2.</span> Passes through origin → y-intercept = 0, so no constant term.</div>
<div class="step"><span class="step-number">3.</span> Eliminate options B and D (they have a constant +1, so y-intercept ≠ 0).</div>
<div class="step"><span class="step-number">4.</span> The slope is negative.</div>
<div class="step"><span class="step-number">5.</span> Eliminate option A: y = 2x has positive slope.</div>
<div class="step"><span class="step-number">6.</span> Option C: y = −2x. At x=0: y = 0. ✓ Slope = −2. ✓</div>
<div class="step"><span class="step-number">7.</span> Option C passes through the origin AND has negative slope.</div>
<div class="step"><span class="step-number">8.</span> When a line passes through the origin, b = 0 in y = mx + b.</div>
<div class="step"><span class="step-number">9.</span> The negative coefficient of x gives the downward slope.</div>
<div class="step"><span class="step-number">10.</span> Correct: y = −2x.</div>`},

// --- A2-9 VARIANTS: Identify y=b^x graph ---
// Original (2025): y=4^x → exponential growth from y=1 (answer=1)
{year:2025,category:'A2',variant:true,q:"Which graph could represent y = 3^x?",options:["Exponential decay passing through (0,1)","Exponential growth passing through (0,1)","Linear growth through (0,0)","Parabola with vertex at (0,0)"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> y = 3^x is an exponential function.</div>
<div class="step"><span class="step-number">2.</span> When x = 0: y = 3⁰ = 1. The graph passes through (0, 1).</div>
<div class="step"><span class="step-number">3.</span> The base is 3. Since 3 > 1, the function grows as x increases.</div>
<div class="step"><span class="step-number">4.</span> As x → −∞, y approaches 0 (but never reaches it).</div>
<div class="step"><span class="step-number">5.</span> As x → +∞, y grows without bound.</div>
<div class="step"><span class="step-number">6.</span> This is exponential growth passing through (0, 1).</div>
<div class="step"><span class="step-number">7.</span> Option A (decay): requires base < 1.</div>
<div class="step"><span class="step-number">8.</span> Options C and D are not exponential curves.</div>
<div class="step"><span class="step-number">9.</span> All exponential functions b^x (b > 0) pass through (0, 1).</div>
<div class="step"><span class="step-number">10.</span> Correct: Exponential growth passing through (0, 1).</div>`},

{year:2025,category:'A2',variant:true,q:"Which graph could represent y = (0.4)^x?",options:["Exponential decay passing through (0,1)","Exponential growth passing through (0,1)","Linear decay through (0,1)","Parabola with vertex at (0,1)"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> y = (0.4)^x is an exponential function.</div>
<div class="step"><span class="step-number">2.</span> When x = 0: y = (0.4)⁰ = 1. The graph passes through (0, 1).</div>
<div class="step"><span class="step-number">3.</span> The base is 0.4. Since 0 < 0.4 < 1, the function decreases as x increases.</div>
<div class="step"><span class="step-number">4.</span> As x → +∞, y approaches 0 (but never reaches it).</div>
<div class="step"><span class="step-number">5.</span> As x → −∞, y grows without bound.</div>
<div class="step"><span class="step-number">6.</span> This is exponential decay passing through (0, 1).</div>
<div class="step"><span class="step-number">7.</span> Option B (growth): requires base > 1.</div>
<div class="step"><span class="step-number">8.</span> Options C and D are not exponential curves.</div>
<div class="step"><span class="step-number">9.</span> Key rule: base between 0 and 1 → exponential decay.</div>
<div class="step"><span class="step-number">10.</span> Correct: Exponential decay passing through (0, 1).</div>`},

{year:2025,category:'A2',variant:true,q:"Which graph could represent y = 10^x?",options:["Passes through (0, 10) with exponential growth","Passes through (0, 1) with exponential growth","Passes through (1, 0) with exponential growth","Passes through (0, 1) with exponential decay"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> y = 10^x is an exponential function.</div>
<div class="step"><span class="step-number">2.</span> When x = 0: y = 10⁰ = 1. The graph passes through (0, 1), not (0, 10).</div>
<div class="step"><span class="step-number">3.</span> The base is 10. Since 10 > 1, the function grows as x increases.</div>
<div class="step"><span class="step-number">4.</span> When x = 1: y = 10¹ = 10. So it passes through (1, 10).</div>
<div class="step"><span class="step-number">5.</span> This is rapid exponential growth passing through (0, 1).</div>
<div class="step"><span class="step-number">6.</span> Option A says passes through (0, 10) — but 10⁰ = 1, not 10.</div>
<div class="step"><span class="step-number">7.</span> Option C says (1, 0) — but 10¹ = 10, not 0.</div>
<div class="step"><span class="step-number">8.</span> Option D says decay — but base 10 > 1 means growth.</div>
<div class="step"><span class="step-number">9.</span> For any b^x: when x=0, y=1 regardless of b (since b⁰=1).</div>
<div class="step"><span class="step-number">10.</span> Correct: Passes through (0, 1) with exponential growth.</div>`},

// --- N1-1 VARIANTS: Bipartite graph (team vs team) ---
// Original (2020): Team A(3) vs Team B(3) → K₃,₃ bipartite (answer=1)
{year:2020,category:'N1',variant:true,q:"Team A (4 members) and Team B (4 members) play chess. Each member of Team A must play each member of Team B once. Which network diagram represents this?",options:["Complete graph K₈","Complete bipartite K₄,₄","Star graph with 8 edges","Cycle graph with 8 vertices"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Each member of Team A plays each member of Team B.</div>
<div class="step"><span class="step-number">2.</span> Team A members play only Team B — no matches within the same team.</div>
<div class="step"><span class="step-number">3.</span> This is a bipartite relationship: two groups, edges only between groups.</div>
<div class="step"><span class="step-number">4.</span> Team A has 4 members, Team B has 4 members.</div>
<div class="step"><span class="step-number">5.</span> Each of the 4 Team A players connects to each of the 4 Team B players.</div>
<div class="step"><span class="step-number">6.</span> Total edges = 4 × 4 = 16.</div>
<div class="step"><span class="step-number">7.</span> This structure is the complete bipartite graph K₄,₄.</div>
<div class="step"><span class="step-number">8.</span> Option A (K₈) would include matches within each team — that's not allowed.</div>
<div class="step"><span class="step-number">9.</span> The K notation K₄,₄ means two groups of 4, fully connected between groups.</div>
<div class="step"><span class="step-number">10.</span> Correct: Complete bipartite K₄,₄.</div>`},

{year:2020,category:'N1',variant:true,q:"Team A (2 members) and Team B (5 members) play tennis. Each member of Team A must play each member of Team B once. Which network diagram represents this?",options:["Complete graph K₇","Complete bipartite K₂,₅","Star graph with 7 vertices","Cycle graph with 7 edges"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Each member of Team A plays each member of Team B.</div>
<div class="step"><span class="step-number">2.</span> Team A members play only Team B — no matches within the same team.</div>
<div class="step"><span class="step-number">3.</span> This is a bipartite relationship: two groups, edges only between groups.</div>
<div class="step"><span class="step-number">4.</span> Team A has 2 members, Team B has 5 members.</div>
<div class="step"><span class="step-number">5.</span> Each of the 2 Team A players connects to each of the 5 Team B players.</div>
<div class="step"><span class="step-number">6.</span> Total edges = 2 × 5 = 10.</div>
<div class="step"><span class="step-number">7.</span> This structure is the complete bipartite graph K₂,₅.</div>
<div class="step"><span class="step-number">8.</span> Option A (K₇) would include matches within each team — not allowed.</div>
<div class="step"><span class="step-number">9.</span> The notation K₂,₅ means two groups (size 2 and size 5), fully connected between groups.</div>
<div class="step"><span class="step-number">10.</span> Correct: Complete bipartite K₂,₅.</div>`},

{year:2020,category:'N1',variant:true,q:"Five people meet at a party and everyone shakes hands with everyone else exactly once. What is the total number of handshakes?",options:["5","8","10","20"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> This is equivalent to counting the edges in the complete graph K₅.</div>
<div class="step"><span class="step-number">2.</span> In K₅, every vertex connects to every other vertex.</div>
<div class="step"><span class="step-number">3.</span> Number of edges in Kₙ = n(n−1)/2.</div>
<div class="step"><span class="step-number">4.</span> For n = 5: edges = 5 × 4 / 2 = 20/2 = 10.</div>
<div class="step"><span class="step-number">5.</span> Alternatively: Person 1 shakes 4 hands, Person 2 shakes 3 new hands, etc.</div>
<div class="step"><span class="step-number">6.</span> 4 + 3 + 2 + 1 + 0 = 10 handshakes.</div>
<div class="step"><span class="step-number">7.</span> Option A (5): each person shaking one hand — undercounts.</div>
<div class="step"><span class="step-number">8.</span> Option D (20): counts each handshake twice (once per person).</div>
<div class="step"><span class="step-number">9.</span> Divide by 2 to avoid double-counting.</div>
<div class="step"><span class="step-number">10.</span> Correct: 10 handshakes.</div>`},

// --- N1-2 VARIANTS: Sum of degrees ---
// Original (2021): 5 vertices, 8 edges → sum of degrees = 16 (answer=3)
{year:2021,category:'N1',variant:true,q:"For a network with 6 vertices and 9 edges, what is the sum of all the degrees?",options:["6","9","15","18"],answer:3,solution:`<div class="step"><span class="step-number">1.</span> The handshaking lemma: sum of all degrees = 2 × number of edges.</div>
<div class="step"><span class="step-number">2.</span> This is because each edge contributes 1 to the degree of each of its two endpoints.</div>
<div class="step"><span class="step-number">3.</span> So each edge is counted twice in the total degree sum.</div>
<div class="step"><span class="step-number">4.</span> Number of edges = 9.</div>
<div class="step"><span class="step-number">5.</span> Sum of all degrees = 2 × 9 = 18.</div>
<div class="step"><span class="step-number">6.</span> Option A (6) is just the number of vertices.</div>
<div class="step"><span class="step-number">7.</span> Option B (9) is just the number of edges.</div>
<div class="step"><span class="step-number">8.</span> Option C (15) = 6 + 9 — incorrectly adds vertices and edges.</div>
<div class="step"><span class="step-number">9.</span> The number of vertices doesn't affect the degree sum calculation.</div>
<div class="step"><span class="step-number">10.</span> Correct: 18.</div>`},

{year:2021,category:'N1',variant:true,q:"For a network with 4 vertices and 7 edges, what is the sum of all the degrees?",options:["4","7","11","14"],answer:3,solution:`<div class="step"><span class="step-number">1.</span> The handshaking lemma: sum of all degrees = 2 × number of edges.</div>
<div class="step"><span class="step-number">2.</span> This is because each edge contributes 1 to the degree of each of its two endpoints.</div>
<div class="step"><span class="step-number">3.</span> So each edge is counted twice in the total degree sum.</div>
<div class="step"><span class="step-number">4.</span> Number of edges = 7.</div>
<div class="step"><span class="step-number">5.</span> Sum of all degrees = 2 × 7 = 14.</div>
<div class="step"><span class="step-number">6.</span> Option A (4) is just the number of vertices.</div>
<div class="step"><span class="step-number">7.</span> Option B (7) is just the number of edges.</div>
<div class="step"><span class="step-number">8.</span> Option C (11) = 4 + 7 — incorrectly adds vertices and edges.</div>
<div class="step"><span class="step-number">9.</span> The number of vertices doesn't affect the degree sum calculation.</div>
<div class="step"><span class="step-number">10.</span> Correct: 14.</div>`},

{year:2021,category:'N1',variant:true,q:"For a network with 8 vertices and 12 edges, what is the sum of all the degrees?",options:["8","12","20","24"],answer:3,solution:`<div class="step"><span class="step-number">1.</span> The handshaking lemma: sum of all degrees = 2 × number of edges.</div>
<div class="step"><span class="step-number">2.</span> This is because each edge contributes 1 to the degree of each of its two endpoints.</div>
<div class="step"><span class="step-number">3.</span> So each edge is counted twice in the total degree sum.</div>
<div class="step"><span class="step-number">4.</span> Number of edges = 12.</div>
<div class="step"><span class="step-number">5.</span> Sum of all degrees = 2 × 12 = 24.</div>
<div class="step"><span class="step-number">6.</span> Option A (8) is just the number of vertices.</div>
<div class="step"><span class="step-number">7.</span> Option B (12) is just the number of edges.</div>
<div class="step"><span class="step-number">8.</span> Option C (20) = 8 + 12 — incorrectly adds vertices and edges.</div>
<div class="step"><span class="step-number">9.</span> The number of vertices doesn't affect the degree sum calculation.</div>
<div class="step"><span class="step-number">10.</span> Correct: 24.</div>`},

// ============================================================

// --- P1-1 VARIANTS: Die × section probability ---
// Original (2020): die(1-6) × section(1-8), P(score=6) = 4/48 = 1/12 (answer=1)
{year:2020,category:'P1',variant:true,q:"A die (numbered 1–6) lands on a table divided into 8 equal sections (numbered 1–8). The score equals the die value multiplied by the section number. What is P(score = 4)?",options:["1/48","1/16","1/12","1/8"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Total outcomes: 6 die faces × 8 sections = 48 equally likely outcomes.</div>
<div class="step"><span class="step-number">2.</span> Find all pairs (die, section) where die × section = 4.</div>
<div class="step"><span class="step-number">3.</span> (1, 4): 1 × 4 = 4 ✓</div>
<div class="step"><span class="step-number">4.</span> (2, 2): 2 × 2 = 4 ✓</div>
<div class="step"><span class="step-number">5.</span> (4, 1): 4 × 1 = 4 ✓</div>
<div class="step"><span class="step-number">6.</span> No other die values (3, 5, 6) combine with valid sections to give 4.</div>
<div class="step"><span class="step-number">7.</span> Favourable outcomes = 3.</div>
<div class="step"><span class="step-number">8.</span> P(score = 4) = 3/48 = 1/16.</div>
<div class="step"><span class="step-number">9.</span> Option C (1/12) = 4/48 — that's P(score = 6) for the original question.</div>
<div class="step"><span class="step-number">10.</span> Correct: 1/16.</div>`},

{year:2020,category:'P1',variant:true,q:"A die (numbered 1–6) lands on a table divided into 8 equal sections (numbered 1–8). The score equals the die value multiplied by the section number. What is P(score = 8)?",options:["1/48","1/16","1/12","1/8"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Total outcomes: 6 die faces × 8 sections = 48 equally likely outcomes.</div>
<div class="step"><span class="step-number">2.</span> Find all pairs (die, section) where die × section = 8.</div>
<div class="step"><span class="step-number">3.</span> (1, 8): 1 × 8 = 8 ✓</div>
<div class="step"><span class="step-number">4.</span> (2, 4): 2 × 4 = 8 ✓</div>
<div class="step"><span class="step-number">5.</span> (4, 2): 4 × 2 = 8 ✓</div>
<div class="step"><span class="step-number">6.</span> No other die values (3, 5, 6) combine with valid sections (1–8) to give 8.</div>
<div class="step"><span class="step-number">7.</span> Note: (8, 1) would need die value 8 — not possible (die only goes to 6).</div>
<div class="step"><span class="step-number">8.</span> Favourable outcomes = 3.</div>
<div class="step"><span class="step-number">9.</span> P(score = 8) = 3/48 = 1/16.</div>
<div class="step"><span class="step-number">10.</span> Correct: 1/16.</div>`},

{year:2020,category:'P1',variant:true,q:"A die (numbered 1–6) lands on a table divided into 8 equal sections (numbered 1–8). The score equals the die value multiplied by the section number. What is P(score = 2)?",options:["1/48","1/24","1/16","1/12"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Total outcomes: 6 die faces × 8 sections = 48 equally likely outcomes.</div>
<div class="step"><span class="step-number">2.</span> Find all pairs (die, section) where die × section = 2.</div>
<div class="step"><span class="step-number">3.</span> (1, 2): 1 × 2 = 2 ✓</div>
<div class="step"><span class="step-number">4.</span> (2, 1): 2 × 1 = 2 ✓</div>
<div class="step"><span class="step-number">5.</span> No other die values (3, 4, 5, 6) give a product of 2 with sections 1–8.</div>
<div class="step"><span class="step-number">6.</span> Favourable outcomes = 2.</div>
<div class="step"><span class="step-number">7.</span> P(score = 2) = 2/48 = 1/24.</div>
<div class="step"><span class="step-number">8.</span> Option A (1/48): only 1 favourable outcome — that would be P(score=1) or another unique score.</div>
<div class="step"><span class="step-number">9.</span> Score 2 has fewer ways than score 6 (which had 4 ways), so probability is smaller.</div>
<div class="step"><span class="step-number">10.</span> Correct: 1/24.</div>`},

// --- P1-2 VARIANTS: Chocolates without replacement ---
// Original (2021): 3P+5C, Kim then Sam, P(different) = 30/56 = 15/28 (answer=3)
{year:2021,category:'P1',variant:true,q:"A box has 4 mint and 6 vanilla chocolates. Kim chooses one, then Sam chooses one (without replacement). What is the probability they choose different flavours?",options:["4/9","8/15","2/5","24/45"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Total chocolates: 4 + 6 = 10.</div>
<div class="step"><span class="step-number">2.</span> P(different) = P(Kim mint, Sam vanilla) + P(Kim vanilla, Sam mint).</div>
<div class="step"><span class="step-number">3.</span> P(Kim mint) = 4/10.</div>
<div class="step"><span class="step-number">4.</span> P(Sam vanilla | Kim mint) = 6/9 (9 remain after Kim takes one).</div>
<div class="step"><span class="step-number">5.</span> P(Kim mint AND Sam vanilla) = 4/10 × 6/9 = 24/90.</div>
<div class="step"><span class="step-number">6.</span> P(Kim vanilla) = 6/10.</div>
<div class="step"><span class="step-number">7.</span> P(Sam mint | Kim vanilla) = 4/9.</div>
<div class="step"><span class="step-number">8.</span> P(Kim vanilla AND Sam mint) = 6/10 × 4/9 = 24/90.</div>
<div class="step"><span class="step-number">9.</span> P(different) = 24/90 + 24/90 = 48/90 = 8/15.</div>
<div class="step"><span class="step-number">10.</span> Correct: 8/15.</div>`},

{year:2021,category:'P1',variant:true,q:"A box has 2 mint and 7 toffee chocolates. Kim chooses one, then Sam chooses one (without replacement). What is the probability they choose different flavours?",options:["2/9","7/18","7/9","7/12"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Total chocolates: 2 + 7 = 9.</div>
<div class="step"><span class="step-number">2.</span> P(different) = P(Kim mint, Sam toffee) + P(Kim toffee, Sam mint).</div>
<div class="step"><span class="step-number">3.</span> P(Kim mint) = 2/9.</div>
<div class="step"><span class="step-number">4.</span> P(Sam toffee | Kim mint) = 7/8.</div>
<div class="step"><span class="step-number">5.</span> P(Kim mint AND Sam toffee) = 2/9 × 7/8 = 14/72.</div>
<div class="step"><span class="step-number">6.</span> P(Kim toffee) = 7/9.</div>
<div class="step"><span class="step-number">7.</span> P(Sam mint | Kim toffee) = 2/8 = 1/4.</div>
<div class="step"><span class="step-number">8.</span> P(Kim toffee AND Sam mint) = 7/9 × 2/8 = 14/72.</div>
<div class="step"><span class="step-number">9.</span> P(different) = 14/72 + 14/72 = 28/72 = 7/18.</div>
<div class="step"><span class="step-number">10.</span> Correct: 7/18.</div>`},

{year:2021,category:'P1',variant:true,q:"A box has 5 dark and 4 white chocolates. Kim chooses one, then Sam chooses one (without replacement). What is the probability they choose different flavours?",options:["5/9","4/9","5/18","20/36"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> Total chocolates: 5 + 4 = 9.</div>
<div class="step"><span class="step-number">2.</span> P(different) = P(Kim dark, Sam white) + P(Kim white, Sam dark).</div>
<div class="step"><span class="step-number">3.</span> P(Kim dark) = 5/9.</div>
<div class="step"><span class="step-number">4.</span> P(Sam white | Kim dark) = 4/8 = 1/2.</div>
<div class="step"><span class="step-number">5.</span> P(Kim dark AND Sam white) = 5/9 × 4/8 = 20/72.</div>
<div class="step"><span class="step-number">6.</span> P(Kim white) = 4/9.</div>
<div class="step"><span class="step-number">7.</span> P(Sam dark | Kim white) = 5/8.</div>
<div class="step"><span class="step-number">8.</span> P(Kim white AND Sam dark) = 4/9 × 5/8 = 20/72.</div>
<div class="step"><span class="step-number">9.</span> P(different) = 20/72 + 20/72 = 40/72 = 5/9.</div>
<div class="step"><span class="step-number">10.</span> Correct: 5/9.</div>`},

// --- P1-3 VARIANTS: Biased die probability estimate ---
// Original (2025): 10-sided die, 72 ones in 153 rolls → P(10) = 81/1377 = 1/17 (answer=3)
{year:2025,category:'P1',variant:true,q:"A 10-sided die is biased. P(1) is greater than P(2) = P(3) = ... = P(10). It is rolled 96 times and lands on 1 exactly 42 times. What is the best estimate for P(10)?",options:["1/14","1/15","1/16","1/17"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> Rolled 96 times, landed on 1 exactly 42 times.</div>
<div class="step"><span class="step-number">2.</span> Times NOT landing on 1 = 96 − 42 = 54.</div>
<div class="step"><span class="step-number">3.</span> Those 54 outcomes were equally shared among faces 2 through 10 (9 faces).</div>
<div class="step"><span class="step-number">4.</span> Expected count for face 10 = 54 ÷ 9 = 6 times.</div>
<div class="step"><span class="step-number">5.</span> P(10) = frequency / total = 6/96.</div>
<div class="step"><span class="step-number">6.</span> Simplify 6/96: divide by 6 → 1/16.</div>
<div class="step"><span class="step-number">7.</span> Option A (1/14): 6/84 — uses wrong total.</div>
<div class="step"><span class="step-number">8.</span> Option D (1/17): 6/102 — uses wrong total.</div>
<div class="step"><span class="step-number">9.</span> Check: 42/96 + 9×(6/96) = 42/96 + 54/96 = 96/96 = 1 ✓</div>
<div class="step"><span class="step-number">10.</span> Correct: 1/16.</div>`},

{year:2025,category:'P1',variant:true,q:"A 10-sided die is biased. P(1) is greater than P(2) = P(3) = ... = P(10). It is rolled 110 times and lands on 1 exactly 55 times. What is the best estimate for P(10)?",options:["1/16","1/17","1/18","1/20"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> Rolled 110 times, landed on 1 exactly 55 times.</div>
<div class="step"><span class="step-number">2.</span> Times NOT landing on 1 = 110 − 55 = 55.</div>
<div class="step"><span class="step-number">3.</span> Those 55 outcomes were equally shared among faces 2 through 10 (9 faces).</div>
<div class="step"><span class="step-number">4.</span> Expected count for face 10 = 55 ÷ 9 ≈ 6.11 times.</div>
<div class="step"><span class="step-number">5.</span> P(10) = (55/9) / 110 = 55 / (9 × 110) = 55/990.</div>
<div class="step"><span class="step-number">6.</span> Simplify 55/990: divide by 55 → 1/18.</div>
<div class="step"><span class="step-number">7.</span> Option A (1/16): 55/880 — uses wrong denominator.</div>
<div class="step"><span class="step-number">8.</span> Option D (1/20): 55/1100 — uses wrong denominator.</div>
<div class="step"><span class="step-number">9.</span> Check: 55/990 = 1/18. And 55/110 + 9×(1/18) = 0.5 + 0.5 = 1 ✓</div>
<div class="step"><span class="step-number">10.</span> Correct: 1/18.</div>`},

{year:2025,category:'P1',variant:true,q:"A 10-sided die is biased. P(1) is greater than P(2) = P(3) = ... = P(10). It is rolled 100 times and lands on 1 exactly 40 times. What is the best estimate for P(10)?",options:["1/12","1/13","1/14","1/15"],answer:3,solution:`<div class="step"><span class="step-number">1.</span> Rolled 100 times, landed on 1 exactly 40 times.</div>
<div class="step"><span class="step-number">2.</span> Times NOT landing on 1 = 100 − 40 = 60.</div>
<div class="step"><span class="step-number">3.</span> Those 60 outcomes were equally shared among faces 2 through 10 (9 faces).</div>
<div class="step"><span class="step-number">4.</span> Expected count for face 10 = 60 ÷ 9 = 6.67 times.</div>
<div class="step"><span class="step-number">5.</span> P(10) = (60/9) / 100 = 60 / (9 × 100) = 60/900.</div>
<div class="step"><span class="step-number">6.</span> Simplify 60/900: divide by 60 → 1/15.</div>
<div class="step"><span class="step-number">7.</span> Option A (1/12): 60/720 — uses wrong denominator.</div>
<div class="step"><span class="step-number">8.</span> Option B (1/13): not obtainable from these numbers.</div>
<div class="step"><span class="step-number">9.</span> Check: 40/100 + 9×(1/15) = 2/5 + 3/5 = 1 ✓</div>
<div class="step"><span class="step-number">10.</span> Correct: 1/15.</div>`},
    ];

// Build question with shuffled options
function questionWithShuffledOptions(q) {
    const shuffled = shuffle(q.options);
    const newAnswer = shuffled.indexOf(q.options[q.answer]);
    return {
        year: q.year,
        category: q.category,
        q: q.q,
        options: shuffled,
        answer: newAnswer,
        solution: q.solution
    };
}

let currentIdx = 0;
let filteredQs = [];
let userAnswers = [];
let isPracticeMode = true;
let questionSetMode = 'original'; // 'original' or 'extended'

function setQuestionSet(mode) {
    questionSetMode = mode;
    document.getElementById('setOriginalBtn').classList.toggle('active', mode === 'original');
    document.getElementById('setExtendedBtn').classList.toggle('active', mode === 'extended');
    updateCategoryFilter(); // rebuilds counts, rebuildFilteredQs, renderQuestion
}

// Rebuild filtered questions
function rebuildFilteredQs() {
    const y = document.getElementById('yearFilter').value;
    const c = document.getElementById('categoryFilter').value;
    
    // Filter by question set mode
    let base = questionSetMode === 'original'
        ? questions.filter(q => !q.variant)
        : questions; // extended = all 318

    if (y !== 'all') base = base.filter(q => q.year === Number(y));
    if (c !== 'all') base = base.filter(q => q.category === c);
    if (y === 'all' && c === 'all') base = shuffle(base);
    
    filteredQs = base.map(questionWithShuffledOptions);
    userAnswers = new Array(filteredQs.length).fill(null);
}

// DOM elements
const els = {
    practiceBtn: document.getElementById('practiceBtn'),
    testBtn: document.getElementById('testBtn'),
    resetBtn: document.getElementById('resetBtn'),
    yearFilter: document.getElementById('yearFilter'),
    categoryFilter: document.getElementById('categoryFilter'),
    quizContent: document.getElementById('quizContent'),
    resultsContent: document.getElementById('resultsContent'),
    currentNum: document.getElementById('currentNum'),
    totalNum: document.getElementById('totalNum'),
    yearBadge: document.getElementById('yearBadge'),
    progressBar: document.getElementById('progressBar'),
    questionText: document.getElementById('questionText'),
    mcOptions: document.getElementById('mcOptions'),
    explanationBox: document.getElementById('explanationBox'),
    explanationText: document.getElementById('explanationText'),
    prevBtn: document.getElementById('prevBtn'),
    checkBtn: document.getElementById('checkBtn'),
    nextBtn: document.getElementById('nextBtn'),
    finalScore: document.getElementById('finalScore'),
    scoreDetail: document.getElementById('scoreDetail'),
    resultsList: document.getElementById('resultsList'),
    resultsResetBtn: document.getElementById('resultsResetBtn')
};

// Update progress
function updateProgress() {
    const pct = ((currentIdx + 1) / filteredQs.length) * 100;
    els.progressBar.style.width = pct + '%';
    els.currentNum.textContent = currentIdx + 1;
    els.totalNum.textContent = filteredQs.length;
    els.yearBadge.textContent = filteredQs[currentIdx].year;
}

// Render question
function renderQuestion() {
    const q = filteredQs[currentIdx];
    els.questionText.textContent = q.q;
    els.mcOptions.innerHTML = '';
    const LETTERS = ['A','B','C','D','E'];
    q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.dataset.idx = i;
        // Letter label
        const label = document.createElement('span');
        label.className = 'opt-label';
        label.textContent = LETTERS[i] || String(i+1);
        // Option text
        const text = document.createElement('span');
        text.className = 'opt-text';
        text.textContent = opt;
        btn.appendChild(label);
        btn.appendChild(text);
        if (userAnswers[currentIdx] === i) btn.classList.add('selected');
        btn.onclick = () => {
            document.querySelectorAll('#mcOptions .option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            userAnswers[currentIdx] = i;
            if (isPracticeMode) els.checkBtn.classList.remove('hidden');
        };
        els.mcOptions.appendChild(btn);
    });
    els.explanationBox.classList.add('hidden');
    els.explanationText.innerHTML = `<div class="step">${q.solution}</div>`;
    els.prevBtn.disabled = currentIdx === 0;
    els.nextBtn.textContent = currentIdx === filteredQs.length - 1 ? 'Finish ✓' : 'Next →';
    els.checkBtn.classList.add('hidden');
    updateProgress();
}

// Check answer
function checkAnswer() {
    const q = filteredQs[currentIdx];
    document.querySelectorAll('#mcOptions .option-btn').forEach((b, i) => {
        b.classList.remove('selected');
        if (i === q.answer) b.classList.add('correct');
        else if (i === userAnswers[currentIdx] && i !== q.answer) b.classList.add('incorrect');
    });
    els.explanationBox.classList.remove('hidden');
    els.checkBtn.classList.add('hidden');
}

// Navigation
function goNext() {
    if (currentIdx < filteredQs.length - 1) {
        currentIdx++;
        renderQuestion();
    } else {
        showResults();
    }
}

function goPrev() {
    if (currentIdx > 0) {
        currentIdx--;
        renderQuestion();
    }
}

// Show results
function showResults() {
    let correct = 0;
    const list = els.resultsList;
    list.innerHTML = '';
    filteredQs.forEach((q, i) => {
        const ans = userAnswers[i];
        if (ans === q.answer) correct++;
        const div = document.createElement('div');
        div.className = 'result-item';
        if (ans === null) div.classList.add('result-unanswered');
        else if (ans === q.answer) div.classList.add('result-correct');
        else div.classList.add('result-incorrect');
        div.innerHTML = `<strong>Q${i+1} (${q.year})</strong><br>${q.q}<br>
                         <em>You: ${ans===null?'—':q.options[ans]}</em><br>
                         <em>Correct: ${q.options[q.answer]}</em>`;
        list.appendChild(div);
    });
    const pct = Math.round((correct / filteredQs.length) * 100);
    els.finalScore.textContent = pct + '%';
    els.scoreDetail.textContent = `${correct} / ${filteredQs.length} correct`;
    els.quizContent.classList.add('hidden');
    els.resultsContent.classList.remove('hidden');
}

// Reset quiz
function resetQuiz() {
    // Reset dropdowns to default ("all")
    els.yearFilter.value = 'all';
    els.categoryFilter.value = 'all';

    // Rebuild the category filter options based on "all years"
    updateCategoryFilter();

    // Rebuild questions, reset index and answers
    rebuildFilteredQs();
    currentIdx = 0;
    userAnswers = new Array(filteredQs.length).fill(null);

    // Hide results and show quiz
    els.resultsContent.classList.add('hidden');
    els.quizContent.classList.remove('hidden');

    // Render the first question
    renderQuestion();
}

// Apply filters
function applyYearFilter() {
    rebuildFilteredQs();
    currentIdx = 0;
    renderQuestion();
}

// Set mode
function setMode(practice) {
    isPracticeMode = practice;
    els.practiceBtn.classList.toggle('active', practice);
    els.testBtn.classList.toggle('active', !practice);
    renderQuestion();
}

// Event listeners
els.practiceBtn.onclick = () => setMode(true);
els.testBtn.onclick = () => setMode(false);
els.resetBtn.onclick = resetQuiz;
els.yearFilter.onchange = () => {
    updateCategoryFilter();
};
els.categoryFilter.onchange = () => {
    rebuildFilteredQs();
    currentIdx = 0;
    renderQuestion();
};
els.prevBtn.onclick = goPrev;
els.nextBtn.onclick = goNext;
els.checkBtn.onclick = checkAnswer;
els.resultsResetBtn.onclick = resetQuiz;

// Initialize category filter on load
updateCategoryFilter();

// Initialize
rebuildFilteredQs();
renderQuestion();
</script>
