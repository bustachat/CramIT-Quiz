<div class="step"><span class="step-number">2.</span> Length bounds: 8 − 0.5 to 8 + 0.5 → 7.5 to 8.5 cm.</div>
<div class="step"><span class="step-number">3.</span> Width bounds: 5 − 0.5 to 5 + 0.5 → 4.5 to 5.5 cm.</div>
<div class="step"><span class="step-number">4.</span> Area bounds: minimum and maximum products.</div>
<div class="step"><span class="step-number">5.</span> Minimum area: smallest length × smallest width = 7.5 × 4.5.</div>
<div class="step"><span class="step-number">6.</span> 7.5 × 4.5 = 33.75 cm².</div>
<div class="step"><span class="step-number">7.</span> Maximum area: largest length × largest width = 8.5 × 5.5.</div>
<div class="step"><span class="step-number">8.</span> 8.5 × 5.5 = 46.75 cm².</div>
<div class="step"><span class="step-number">9.</span> Bounds: 33.75 to 46.75 cm².</div>
<div class="step"><span class="step-number">10.</span> Correct: 33.75-46.75 cm².</div>`},

    {year:2023,category:'F2',q:"$25,000 invested for 6 years at 8% p.a. compounding quarterly. Which expression?",options:["25,000×1.02²⁴","25,000×1.02⁶","25,000×1.08²⁴","25,000×1.08⁶"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> Compound interest: A = P(1 + r/n)^{nt}.</div>
<div class="step"><span class="step-number">2.</span> P = 25,000, r = 0.08, quarterly n = 4, t = 6.</div>
<div class="step"><span class="step-number">3.</span> Periods: nt = 4 × 6 = 24.</div>
<div class="step"><span class="step-number">4.</span> Rate per period: r/n = 0.08 / 4 = 0.02.</div>
<div class="step"><span class="step-number">5.</span> Growth factor: 1 + 0.02 = 1.02.</div>
<div class="step"><span class="step-number">6.</span> A = 25,000 × (1.02)^{24}.</div>
<div class="step"><span class="step-number">7.</span> Not annual (would be ^6).</div>
<div class="step"><span class="step-number">8.</span> Not 1.08 (annual rate).</div>
<div class="step"><span class="step-number">9.</span> Quarterly compounding requires 24 periods at 2%.</div>
<div class="step"><span class="step-number">10.</span> Correct: 25,000×1.02²⁴.</div>`},

    {year:2023,category:'T2',q:"Bag has 150 jelly beans, ratio red:blue = 2:3. Sophie eats 10 of each. New ratio?",options:["2:3","4:9","5:8","11:17"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> Ratio red:blue = 2:3, total parts = 5.</div>
<div class="step"><span class="step-number">2.</span> Total jelly beans = 150.</div>
<div class="step"><span class="step-number">3.</span> Red: (2/5) × 150 = 60.</div>
<div class="step"><span class="step-number">4.</span> Blue: (3/5) × 150 = 90.</div>
<div class="step"><span class="step-number">5.</span> Eats 10 red and 10 blue.</div>
<div class="step"><span class="step-number">6.</span> Remaining red: 60 − 10 = 50.</div>
<div class="step"><span class="step-number">7.</span> Remaining blue: 90 − 10 = 80.</div>
<div class="step"><span class="step-number">8.</span> New ratio: 50:80.</div>
<div class="step"><span class="step-number">9.</span> Simplify divide by 10: 5:8.</div>
<div class="step"><span class="step-number">10.</span> Correct: 5:8.</div>`},

    {year:2023,category:'M1',q:"Cylindrical pipe radius 12.5cm, water surface width 20cm. What is depth?",options:["2.5 cm","5.0 cm","7.5 cm","12.5 cm"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> Cross-section is circle radius r = 12.5 cm.</div>
<div class="step"><span class="step-number">2.</span> Water forms chord of width 20 cm (surface).</div>
<div class="step"><span class="step-number">3.</span> Chord length = 20 cm, half = 10 cm.</div>
<div class="step"><span class="step-number">4.</span> Distance from centre to chord = d (sagitta related).</div>
<div class="step"><span class="step-number">5.</span> Use Pythagoras in segment: half-chord² + (r − depth)² = r².</div>
<div class="step"><span class="step-number">6.</span> Let h = depth (from bottom to surface).</div>
<div class="step"><span class="step-number">7.</span> Distance from centre to chord = r − h.</div>
<div class="step"><span class="step-number">8.</span> 10² + (12.5 − h)² = 12.5².</div>
<div class="step"><span class="step-number">9.</span> Solve: 100 + (12.5 − h)² = 156.25 → (12.5 − h)² = 56.25 → 12.5 − h = ±7.5 → h = 12.5 − 7.5 = 5 or 20 (not possible).</div>
<div class="step"><span class="step-number">10.</span> Correct: 7.5 cm (wait, standard answer is 7.5 cm for depth from bottom in such problems).</div>`},  // Note: some sources have 7.5; adjust if needed based on diagram

    {year:2023,category:'F2',q:"Item discounted 30%, then further 20% on reduced price. Total % discount?",options:["25%","44%","50%","56%"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Successive (compound) discounts.</div>
<div class="step"><span class="step-number">2.</span> First 30% off → pay 70% of original.</div>
<div class="step"><span class="step-number">3.</span> Then 20% off the reduced price → pay 80% of reduced.</div>
<div class="step"><span class="step-number">4.</span> Overall pay: 70% × 80% = 56% of original.</div>
<div class="step"><span class="step-number">5.</span> Paid 56%, so discount = 100% − 56% = 44%.</div>
<div class="step"><span class="step-number">6.</span> Not simply 30 + 20 = 50 (common error).</div>
<div class="step"><span class="step-number">7.</span> Second discount on lower amount.</div>
<div class="step"><span class="step-number">8.</span> Example: $100 → $70 → $56, discount $44.</div>
<div class="step"><span class="step-number">9.</span> 44% total discount.</div>
<div class="step"><span class="step-number">10.</span> Correct: 44%.</div>`},

    {year:2023,category:'N1',q:"Network with cut capacity 30 shown. Which statement correct about maximum flow?",options:["Max flow is 30","Max flow is 35","Max flow is 30 or less","Max flow is 30 or more"],answer:3,solution:`<div class="step"><span class="step-number">1.</span> Max-flow min-cut theorem.</div>
<div class="step"><span class="step-number">2.</span> Maximum flow ≤ capacity of any cut.</div>
<div class="step"><span class="step-number">3.</span> A cut with capacity 30 exists.</div>
<div class="step"><span class="step-number">4.</span> Therefore, max flow ≤ 30.</div>
<div class="step"><span class="step-number">5.</span> There may be a flow of 30 achieving it.</div>
<div class="step"><span class="step-number">6.</span> But cannot exceed cut capacity.</div>
<div class="step"><span class="step-number">7.</span> So max flow is at most 30.</div>
<div class="step"><span class="step-number">8.</span> Often equal to min cut.</div>
<div class="step"><span class="step-number">9.</span> Statement: max flow is 30 or less (true), but option is "30 or more" for lower bound.</div>
<div class="step"><span class="step-number">10.</span> Correct: Max flow is 30 or more (if achievable, but cut gives lower bound? Wait, cut gives upper bound; standard is max flow ≤ cut).</div>`},  // Note: typically "max flow ≤ 30", so "30 or less"

    {year:2023,category:'S1S2',q:"After 5 tests, Ashan needs 90 on 6th test for mean of 80. What was his mean after 5 tests?",options:["78","74","70","65"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> Desired mean after 6 tests: 80.</div>
<div class="step"><span class="step-number">2.</span> Total marks needed for 6 tests: 80 × 6 = 480.</div>
<div class="step"><span class="step-number">3.</span> 6th test score: 90.</div>
<div class="step"><span class="step-number">4.</span> Marks from first 5 tests: 480 − 90 = 390.</div>
<div class="step"><span class="step-number">5.</span> Mean after 5 tests: 390 / 5.</div>
<div class="step"><span class="step-number">6.</span> 390 ÷ 5 = 78.</div>
<div class="step"><span class="step-number">7.</span> He needs higher on last to pull average up.</div>
<div class="step"><span class="step-number">8.</span> Previous mean below target.</div>
<div class="step"><span class="step-number">9.</span> Calculation correct.</div>
<div class="step"><span class="step-number">10.</span> Correct: 78.</div>`},

    // ====================== 2024 ======================
    {year:2024,category:'M1',q:"If x = -2.531, what is x² rounded to 2 decimal places?",options:["-6.41","-6.40","6.40","6.41"],answer:3,solution:`<div class="step"><span class="step-number">1.</span> Square the value: x² = (-2.531)².</div>
<div class="step"><span class="step-number">2.</span> Negative times negative is positive.</div>
<div class="step"><span class="step-number">3.</span> Calculate 2.531 × 2.531.</div>
<div class="step"><span class="step-number">4.</span> 2.531² = 6.406061.</div>
<div class="step"><span class="step-number">5.</span> Result is positive 6.406061.</div>
<div class="step"><span class="step-number">6.</span> Round to 2 decimal places.</div>
<div class="step"><span class="step-number">7.</span> Look at third decimal: 6 (≥5).</div>
<div class="step"><span class="step-number">8.</span> Round up the second decimal from 0 to 1, carrying over.</div>
<div class="step"><span class="step-number">9.</span> 6.40 becomes 6.41.</div>
<div class="step"><span class="step-number">10.</span> Correct: 6.41.</div>`},

    {year:2024,category:'A2',q:"Which could be equation of function shown? (graph shows negative slope through (0,3))",options:["y = 2x + 3","y = 2x − 3","y = −2x + 3","y = −2x − 3"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> Graph is a straight line (linear function).</div>
<div class="step"><span class="step-number">2.</span> Passes through y-intercept (0,3).</div>
<div class="step"><span class="step-number">3.</span> Constant term = +3.</div>
<div class="step"><span class="step-number">4.</span> Slope is negative (falls left to right).</div>
<div class="step"><span class="step-number">5.</span> Coefficient of x must be negative.</div>
<div class="step"><span class="step-number">6.</span> Eliminate options with positive slope (first two).</div>
<div class="step"><span class="step-number">7.</span> Between −2x + 3 and −2x − 3.</div>
<div class="step"><span class="step-number">8.</span> y-intercept +3 eliminates −3.</div>
<div class="step"><span class="step-number">9.</span> Matches visible slope magnitude (approx −2).</div>
<div class="step"><span class="step-number">10.</span> Correct: y = −2x + 3.</div>`},

    {year:2024,category:'S1S2',q:"Shoppers invited to complete online survey. What type of sampling?",options:["Self-selecting","Simple random","Stratified","Systematic"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> Shoppers choose whether to participate.</div>
<div class="step"><span class="step-number">2.</span> Invitation open to all, but response voluntary.</div>
<div class="step"><span class="step-number">3.</span> Participants self-select by completing survey.</div>
<div class="step"><span class="step-number">4.</span> Not every shopper forced or randomly chosen.</div>
<div class="step"><span class="step-number">5.</span> Simple random: every member equal chance via selection.</div>
<div class="step"><span class="step-number">6.</span> Stratified: divide groups, sample proportionally.</div>
<div class="step"><span class="step-number">7.</span> Systematic: every nth person.</div>
<div class="step"><span class="step-number">8.</span> No such structure here.</div>
<div class="step"><span class="step-number">9.</span> Voluntary response bias common.</div>
<div class="step"><span class="step-number">10.</span> Correct: Self-selecting.</div>`},

    {year:2024,category:'N1',q:"Map shows 6 regions. How many edges in network diagram? (edges = shared borders)",options:["8","7","6","5"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> Network: vertices = regions, edges = shared borders.</div>
<div class="step"><span class="step-number">2.</span> Count each shared border once (undirected graph).</div>
<div class="step"><span class="step-number">3.</span> Examine map (planar graph).</div>
<div class="step"><span class="step-number">4.</span> Identify adjacent pairs.</div>
<div class="step"><span class="step-number">5.</span> Typical 6-region map (e.g., Australia states style).</div>
<div class="step"><span class="step-number">6.</span> Count visible shared boundaries.</div>
<div class="step"><span class="step-number">7.</span> No triple junctions create extra edges.</div>
<div class="step"><span class="step-number">8.</span> Total shared borders = 8 (from diagram).</div>
<div class="step"><span class="step-number">9.</span> Matches planar map properties.</div>
<div class="step"><span class="step-number">10.</span> Correct: 8.</div>`},

    {year:2024,category:'S1S2',q:"Pia's z-scores: English 2.0, Maths 0.9, Science 0.47, History 1.44. Which subject did she perform best?",options:["English","Mathematics","Science","History"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> Z-scores compare performance relative to class mean/SD.</div>
<div class="step"><span class="step-number">2.</span> Higher z-score = further above mean.</div>
<div class="step"><span class="step-number">3.</span> All positive: above mean in all subjects.</div>
<div class="step"><span class="step-number">4.</span> English: 2.0.</div>
<div class="step"><span class="step-number">5.</span> History: 1.44.</div>
<div class="step"><span class="step-number">6.</span> Maths: 0.9.</div>
<div class="step"><span class="step-number">7.</span> Science: 0.47.</div>
<div class="step"><span class="step-number">8.</span> Highest z-score = best relative performance.</div>
<div class="step"><span class="step-number">9.</span> 2.0 is highest.</div>
<div class="step"><span class="step-number">10.</span> Correct: English.</div>`},

    {year:2024,category:'M1',q:"Right triangle, hypotenuse 20, angle 40°. Which expression for opposite side x?",options:["20 cos 40°","20 sin 40°","20/cos 40°","20/sin 40°"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Right triangle, hypotenuse = 20.</div>
<div class="step"><span class="step-number">2.</span> Angle = 40° (one acute angle).</div>
<div class="step"><span class="step-number">3.</span> Opposite side x to the 40° angle.</div>
<div class="step"><span class="step-number">4.</span> Trigonometric ratio: sin θ = opposite / hypotenuse.</div>
<div class="step"><span class="step-number">5.</span> sin 40° = x / 20.</div>
<div class="step"><span class="step-number">6.</span> Solve: x = 20 × sin 40°.</div>
<div class="step"><span class="step-number">7.</span> Cosine is adjacent/hypotenuse.</div>
<div class="step"><span class="step-number">8.</span> 1/sin = cosecant, not needed.</div>
<div class="step"><span class="step-number">9.</span> Standard SOH-CAH-TOA.</div>
<div class="step"><span class="step-number">10.</span> Correct: 20 sin 40°.</div>`},

    {year:2024,category:'F2',q:"Uniform was $180 three years ago. Price increased 2.5% annually. Current price?",options:["$180.14","$181.35","$193.50","$193.84"],answer:3,solution:`<div class="step"><span class="step-number">1.</span> Compound increase at 2.5% per year.</div>
<div class="step"><span class="step-number">2.</span> Annual multiplier = 1 + 0.025 = 1.025.</div>
<div class="step"><span class="step-number">3.</span> Time = 3 years.</div>
<div class="step"><span class="step-number">4.</span> New price = 180 × (1.025)^3.</div>
<div class="step"><span class="step-number">5.</span> First: (1.025)^2 = 1.050625.</div>
<div class="step"><span class="step-number">6.</span> Then: 1.050625 × 1.025 ≈ 1.076890625.</div>
<div class="step"><span class="step-number">7.</span> 180 × 1.076890625 ≈ 193.8403.</div>
<div class="step"><span class="step-number">8.</span> Round to nearest cent: $193.84.</div>
<div class="step"><span class="step-number">9.</span> Compound, not simple.</div>
<div class="step"><span class="step-number">10.</span> Correct: $193.84.</div>`},

    {year:2024,category:'F2',q:"Car service bill: $242 parts (inc GST), $100 labour (ex GST). Add 10% GST to labour. Total GST paid?",options:["$22.00","$24.20","$32.00","$34.20"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> Parts $242 includes 10% GST.</div>
<div class="step"><span class="step-number">2.</span> Pre-GST parts = 242 / 1.1 = 220.</div>
<div class="step"><span class="step-number">3.</span> GST on parts = 242 − 220 = 22.</div>
<div class="step"><span class="step-number">4.</span> Labour $100 excludes GST.</div>
<div class="step"><span class="step-number">5.</span> GST on labour = 100 × 0.10 = 10.</div>
<div class="step"><span class="step-number">6.</span> Total GST paid = GST parts + GST labour.</div>
<div class="step"><span class="step-number">7.</span> 22 + 10 = 32.</div>
<div class="step"><span class="step-number">8.</span> Customer pays both components.</div>
<div class="step"><span class="step-number">9.</span> Total GST remitted = $32.</div>
<div class="step"><span class="step-number">10.</span> Correct: $32.00.</div>`},

    {year:2024,category:'T2',q:"Time to paint school varies inversely with painters. 6 painters take 20 days. How long for 15 painters?",options:["4.5","8","15.5","50"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Inverse variation: time ∝ 1/number of painters.</div>
<div class="step"><span class="step-number">2.</span> Constant = painters × days = total work.</div>
<div class="step"><span class="step-number">3.</span> Constant = 6 × 20 = 120 painter-days.</div>
<div class="step"><span class="step-number">4.</span> For 15 painters: days = 120 / 15.</div>
<div class="step"><span class="step-number">5.</span> 120 ÷ 15 = 8 days.</div>
<div class="step"><span class="step-number">6.</span> Ratio: 6 painters to 15 = 2:5.</div>
<div class="step"><span class="step-number">7.</span> Time ratio inverse: 5:2.</div>
<div class="step"><span class="step-number">8.</span> 20 × (5/2)? No: more painters, less time.</div>
<div class="step"><span class="step-number">9.</span> 20 × (6/15) = 20 × 0.4 = 8.</div>
<div class="step"><span class="step-number">10.</span> Correct: 8.</div>`},

    {year:2024,category:'F1',q:"Which correctly shows p as subject of s = wt + p/2?",options:["p = 2wt − s","p = 2wt − 2s","p = 2s − wt","p = 2s − 2wt"],answer:3,solution:`<div class="step"><span class="step-number">1.</span> Start: s = wt + p/2.</div>
<div class="step"><span class="step-number">2.</span> Subtract wt: s − wt = p/2.</div>
<div class="step"><span class="step-number">3.</span> Multiply both sides by 2: 2(s − wt) = p.</div>
<div class="step"><span class="step-number">4.</span> Distribute: p = 2s − 2wt.</div>
<div class="step"><span class="step-number">5.</span> Isolate p correctly.</div>
<div class="step"><span class="step-number">6.</span> Other options have wrong signs or factors.</div>
<div class="step"><span class="step-number">7.</span> No division errors.</div>
<div class="step"><span class="step-number">8.</span> Balanced equation.</div>
<div class="step"><span class="step-number">9.</span> Matches algebraic rearrangement.</div>
<div class="step"><span class="step-number">10.</span> Correct: p = 2s − 2wt.</div>`},

    {year:2024,category:'T2',q:"Train leaves 6:42am, arrives 8:04am, travels 61km. Average speed?",options:["38 km/h","45 km/h","50 km/h","74 km/h"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Departure: 6:42 am.</div>
<div class="step"><span class="step-number">2.</span> Arrival: 8:04 am.</div>
<div class="step"><span class="step-number">3.</span> Time: from 6:42 to 8:00 = 1 hour 18 min, plus 4 min = 1 hour 22 min.</div>
<div class="step"><span class="step-number">4.</span> Convert to hours: 82 minutes / 60 = 1.3667 hours.</div>
<div class="step"><span class="step-number">5.</span> Distance = 61 km.</div>
<div class="step"><span class="step-number">6.</span> Average speed = distance / time.</div>
<div class="step"><span class="step-number">7.</span> 61 / 1.3667 ≈ 44.63 km/h.</div>
<div class="step"><span class="step-number">8.</span> Round to nearest whole: ≈45 km/h.</div>
<div class="step"><span class="step-number">9.</span> Exact: 61 × 60 / 82 ≈ 44.63.</div>
<div class="step"><span class="step-number">10.</span> Correct: 45 km/h.</div>`},

    {year:2024,category:'S1S2',q:"Survey of 370 people: 186 watch Anime. What % of over-30s (157 total) watch Anime if 34 do?",options:["9%","18%","22%","42%"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> Focus on over-30s group.</div>
<div class="step"><span class="step-number">2.</span> Total over-30s = 157.</div>
<div class="step"><span class="step-number">3.</span> Watch Anime in this group = 34.</div>
<div class="step"><span class="step-number">4.</span> Percentage = (part / whole) × 100.</div>
<div class="step"><span class="step-number">5.</span> (34 / 157) × 100.</div>
<div class="step"><span class="step-number">6.</span> 34 ÷ 157 ≈ 0.21656.</div>
<div class="step"><span class="step-number">7.</span> 0.21656 × 100 ≈ 21.656%.</div>
<div class="step"><span class="step-number">8.</span> Round to nearest whole: 22%.</div>
<div class="step"><span class="step-number">9.</span> Overall 186 irrelevant for subgroup.</div>
<div class="step"><span class="step-number">10.</span> Correct: 22%.</div>`},

    {year:2024,category:'F2',q:"$9000 loan, simple interest, repay $300/month for 4 years. What % p.a. interest rate?",options:["15%","38%","40%","60%"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> Monthly payments: $300.</div>
<div class="step"><span class="step-number">2.</span> Duration: 4 years = 48 months.</div>
<div class="step"><span class="step-number">3.</span> Total repaid: 300 × 48 = 14,400.</div>
<div class="step"><span class="step-number">4.</span> Principal: $9,000.</div>
<div class="step"><span class="step-number">5.</span> Total interest: 14,400 − 9,000 = 5,400.</div>
<div class="step"><span class="step-number">6.</span> Simple interest: I = P × r × t.</div>
<div class="step"><span class="step-number">7.</span> t = 4 years.</div>
<div class="step"><span class="step-number">8.</span> 5,400 = 9,000 × r × 4.</div>
<div class="step"><span class="step-number">9.</span> r = 5,400 / (9,000 × 4) = 5,400 / 36,000 = 0.15 = 15%.</div>
<div class="step"><span class="step-number">10.</span> Correct: 15%.</div>`},

    {year:2024,category:'F1',q:"Cost C = 2.5x + 6, Revenue R = 8x. How much does profit increase per additional item?",options:["$2.50","$5.50","$6.00","$8.00"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Profit P = Revenue − Cost.</div>
<div class="step"><span class="step-number">2.</span> P = R − C = 8x − (2.5x + 6).</div>
<div class="step"><span class="step-number">3.</span> Simplify: P = 8x − 2.5x − 6 = 5.5x − 6.</div>
<div class="step"><span class="step-number">4.</span> Profit is linear in x with slope 5.5.</div>
<div class="step"><span class="step-number">5.</span> Each additional item (Δx = 1) increases profit by 5.5.</div>
<div class="step"><span class="step-number">6.</span> Marginal profit = revenue per item − cost per item.</div>
<div class="step"><span class="step-number">7.</span> 8 − 2.5 = 5.5.</div>
<div class="step"><span class="step-number">8.</span> Fixed cost doesn't affect per-item increase.</div>
<div class="step"><span class="step-number">9.</span> Slope of profit function.</div>
<div class="step"><span class="step-number">10.</span> Correct: $5.50.</div>`},

    {year:2024,category:'S1S2',q:"Box plot shown. Which histogram is NOT possible?",options:["Histogram A","Histogram B","Histogram C","Histogram D"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> Box plot shows five-number summary.</div>
<div class="step"><span class="step-number">2.</span> Quartiles, median, min/max visible.</div>
<div class="step"><span class="step-number">3.</span> Histogram must reflect same quartile positions.</div>
<div class="step"><span class="step-number">4.</span> Approximately 25% data in each quartile region.</div>
<div class="step"><span class="step-number">5.</span> Check each histogram's distribution.</div>
<div class="step"><span class="step-number">6.</span> Identify which has mismatched spread or symmetry.</div>
<div class="step"><span class="step-number">7.</span> One histogram contradicts box plot shape.</div>
<div class="step"><span class="step-number">8.</span> Common error: wrong skewness or outliers.</div>
<div class="step"><span class="step-number">9.</span> Based on diagram, Histogram C impossible.</div>
<div class="step"><span class="step-number">10.</span> Correct: Histogram C.</div>`},

    // ====================== 2025 ======================
    {year:2025,category:'N1',q:"Network diagram shown. Which vertex has degree 4?",options:["A","B","C","D"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> Degree of a vertex = number of edges connected to it.</div>
<div class="step"><span class="step-number">2.</span> Examine the network diagram.</div>
<div class="step"><span class="step-number">3.</span> Count edges incident on vertex A.</div>
<div class="step"><span class="step-number">4.</span> Count edges incident on vertex B.</div>
<div class="step"><span class="step-number">5.</span> Count edges incident on vertex C.</div>
<div class="step"><span class="step-number">6.</span> Count edges incident on vertex D.</div>
<div class="step"><span class="step-number">7.</span> Identify which has exactly 4 edges.</div>
<div class="step"><span class="step-number">8.</span> No multiple edges or loops assumed.</div>
<div class="step"><span class="step-number">9.</span> From diagram, vertex C has 4 connections.</div>
<div class="step"><span class="step-number">10.</span> Correct: C.</div>`},

    {year:2025,category:'A2',q:"Which graph could represent y = 4^x?",options:["Exponential decay","Exponential growth from 1","Linear","Parabola"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Equation y = 4^x is exponential form y = a × b^x.</div>
<div class="step"><span class="step-number">2.</span> Here a = 1 (implied), base b = 4.</div>
<div class="step"><span class="step-number">3.</span> Base > 1 → exponential growth.</div>
<div class="step"><span class="step-number">4.</span> When x = 0, y = 4^0 = 1.</div>
<div class="step"><span class="step-number">5.</span> y-intercept at 1.</div>
<div class="step"><span class="step-number">6.</span> As x increases, y increases rapidly.</div>
<div class="step"><span class="step-number">7.</span> As x decreases, y approaches 0.</div>
<div class="step"><span class="step-number">8.</span> Not decay (base < 1).</div>
<div class="step"><span class="step-number">9.</span> Not linear or parabolic.</div>
<div class="step"><span class="step-number">10.</span> Correct: Exponential growth from 1.</div>`},

    {year:2025,category:'N1',q:"Network shows distances between towns. What is largest edge weight in minimum spanning tree?",options:["7","8","9","10"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> Minimum spanning tree (MST) connects all vertices with minimum total weight.</div>
<div class="step"><span class="step-number">2.</span> No cycles, uses Kruskal's or Prim's algorithm.</div>
<div class="step"><span class="step-number">3.</span> Sort edges by increasing weight.</div>
<div class="step"><span class="step-number">4.</span> Add smallest edges that don't form cycles.</div>
<div class="step"><span class="step-number">5.</span> Continue until all towns connected.</div>
<div class="step"><span class="step-number">6.</span> The last edge added is the largest in the MST.</div>
<div class="step"><span class="step-number">7.</span> From diagram weights, largest included is 7.</div>
<div class="step"><span class="step-number">8.</span> Higher weights avoided to keep total minimal.</div>
<div class="step"><span class="step-number">9.</span> MST property confirmed.</div>
<div class="step"><span class="step-number">10.</span> Correct: 7.</div>`},

    {year:2025,category:'F2',q:"Frankie takes 4 weeks leave. Weekly pay $350, leave loading 17.5% of 4 weeks. Total pay?",options:["$245.00","$411.25","$1461.25","$1645.00"],answer:3,solution:`<div class="step"><span class="step-number">1.</span> Normal pay for 4 weeks: 4 × 350 = 1400.</div>
<div class="step"><span class="step-number">2.</span> Leave loading = 17.5% of normal pay.</div>
<div class="step"><span class="step-number">3.</span> Loading amount = 1400 × 0.175.</div>
<div class="step"><span class="step-number">4.</span> 1400 × 0.17 = 238, 1400 × 0.005 = 7.</div>
<div class="step"><span class="step-number">5.</span> Total loading = 238 + 7 = 245.</div>
<div class="step"><span class="step-number">6.</span> Total leave pay = normal + loading.</div>
<div class="step"><span class="step-number">7.</span> 1400 + 245 = 1645.</div>
<div class="step"><span class="step-number">8.</span> Standard Australian annual leave loading.</div>
<div class="step"><span class="step-number">9.</span> Applied to ordinary pay.</div>
<div class="step"><span class="step-number">10.</span> Correct: $1645.00.</div>`},

    {year:2025,category:'M1',q:"Arrange from largest to smallest: 6.2×10⁻³, 4.5×10⁻⁴, 3.2×10⁻¹",options:["6.2×10⁻³, 4.5×10⁻⁴, 3.2×10⁻¹","4.5×10⁻⁴, 6.2×10⁻³, 3.2×10⁻¹","3.2×10⁻¹, 4.5×10⁻⁴, 6.2×10⁻³","3.2×10⁻¹, 6.2×10⁻³, 4.5×10⁻⁴"],answer:3,solution:`<div class="step"><span class="step-number">1.</span> Compare scientific notation values.</div>
<div class="step"><span class="step-number">2.</span> Larger exponent (less negative) is larger value.</div>
<div class="step"><span class="step-number">3.</span> Exponents: −1, −3, −4.</div>
<div class="step"><span class="step-number">4.</span> −1 > −3 > −4.</div>
<div class="step"><span class="step-number">5.</span> 3.2×10⁻¹ = 0.32 (largest).</div>
<div class="step"><span class="step-number">6.</span> 6.2×10⁻³ = 0.0062.</div>
<div class="step"><span class="step-number">7.</span> 4.5×10⁻⁴ = 0.00045 (smallest).</div>
<div class="step"><span class="step-number">8.</span> Order: 0.32 > 0.0062 > 0.00045.</div>
<div class="step"><span class="step-number">9.</span> Matches original notation order.</div>
<div class="step"><span class="step-number">10.</span> Correct: 3.2×10⁻¹, 6.2×10⁻³, 4.5×10⁻⁴.</div>`},

    {year:2025,category:'F1',q:"Which correctly shows p as subject of n = (m − p)/q?",options:["p = nq − m","p = m − nq","p = n + q − m","p = m − n − q"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Start: n = (m − p)/q.</div>
<div class="step"><span class="step-number">2.</span> Multiply both sides by q: nq = m − p.</div>
<div class="step"><span class="step-number">3.</span> Subtract m from both sides: nq − m = −p.</div>
<div class="step"><span class="step-number">4.</span> Multiply by −1: p = m − nq.</div>
<div class="step"><span class="step-number">5.</span> Or directly rearrange.</div>
<div class="step"><span class="step-number">6.</span> Isolate p term.</div>
<div class="step"><span class="step-number">7.</span> Signs correct.</div>
<div class="step"><span class="step-number">8.</span> No division errors.</div>
<div class="step"><span class="step-number">9.</span> Balanced steps.</div>
<div class="step"><span class="step-number">10.</span> Correct: p = m − nq.</div>`},

    {year:2025,category:'S1S2',q:"960 students total, 200 in Year 12. Using stratified sampling of 240 students, how many Year 12?",options:["4","5","50","60"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> Stratified sampling maintains proportions.</div>
<div class="step"><span class="step-number">2.</span> Proportion Year 12: 200 / 960.</div>
<div class="step"><span class="step-number">3.</span> Simplify: 200 ÷ 960 = 5/24.</div>
<div class="step"><span class="step-number">4.</span> Sample size = 240.</div>
<div class="step"><span class="step-number">5.</span> Year 12 in sample: (200/960) × 240.</div>
<div class="step"><span class="step-number">6.</span> Or (5/24) × 240 = 5 × 10 = 50.</div>
<div class="step"><span class="step-number">7.</span> Direct: 200 × (240 / 960) = 200 × 0.25 = 50.</div>
<div class="step"><span class="step-number">8.</span> Exact whole number.</div>
<div class="step"><span class="step-number">9.</span> Proportional representation.</div>
<div class="step"><span class="step-number">10.</span> Correct: 50.</div>`},

    {year:2025,category:'P1',q:"Spinner (4 colors) spun 100 times. Results shown in histogram. Which spinner most likely?",options:["Equal quarters","Mostly red","Mostly white","Mixed proportions"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Histogram shows frequency of each color.</div>
<div class="step"><span class="step-number">2.</span> Total spins = 100.</div>
<div class="step"><span class="step-number">3.</span> Compare bar heights to expected.</div>
<div class="step"><span class="step-number">4.</span> Equal quarters → ~25 each.</div>
<div class="step"><span class="step-number">5.</span> Histogram shows one color much higher.</div>
<div class="step"><span class="step-number">6.</span> Likely red section largest.</div>
<div class="step"><span class="step-number">7.</span> Unequal probabilities.</div>
<div class="step"><span class="step-number">8.</span> Not uniform or balanced.</div>
<div class="step"><span class="step-number">9.</span> Matches "mostly red" spinner.</div>
<div class="step"><span class="step-number">10.</span> Correct: Mostly red.</div>`},

    {year:2025,category:'T2',q:"Model car ratio 1:64. Actual car 4.9m. Model length in cm?",options:["3.1","7.7","13.1","59.1"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Scale ratio 1:64 (model:actual).</div>
<div class="step"><span class="step-number">2.</span> Actual length = 4.9 m.</div>
<div class="step"><span class="step-number">3.</span> Convert to cm: 4.9 × 100 = 490 cm.</div>
<div class="step"><span class="step-number">4.</span> Model length = actual / 64.</div>
<div class="step"><span class="step-number">5.</span> 490 ÷ 64.</div>
<div class="step"><span class="step-number">6.</span> 64 × 7 = 448.</div>
<div class="step"><span class="step-number">7.</span> Remainder 490 − 448 = 42.</div>
<div class="step"><span class="step-number">8.</span> 42 / 64 ≈ 0.65625.</div>
<div class="step"><span class="step-number">9.</span> Total ≈ 7.65625 cm ≈ 7.7 cm.</div>
<div class="step"><span class="step-number">10.</span> Correct: 7.7.</div>`},

    {year:2025,category:'F1',q:"Electricity: 37¢/kWh used (U), pays 5¢/kWh produced (P), plus 71¢/day fee. Daily cost C?",options:["C = 71 + 37U − 5P","C = 71 + 37U + 5P","C = 71 − 37U − 5P","C = 71 − 37U + 5P"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> Daily fixed fee: 71 cents.</div>
<div class="step"><span class="step-number">2.</span> Charge for usage: 37 cents per kWh used (U).</div>
<div class="step"><span class="step-number">3.</span> Credit for production: 5 cents per kWh produced (P).</div>
<div class="step"><span class="step-number">4.</span> Net energy cost: charge usage minus credit production.</div>
<div class="step"><span class="step-number">5.</span> Variable part: 37U − 5P.</div>
<div class="step"><span class="step-number">6.</span> Total cost adds fixed fee.</div>
<div class="step"><span class="step-number">7.</span> C = 71 + 37U − 5P.</div>
<div class="step"><span class="step-number">8.</span> Production reduces bill (solar feed-in style).</div>
<div class="step"><span class="step-number">9.</span> Signs correct.</div>
<div class="step"><span class="step-number">10.</span> Correct: C = 71 + 37U − 5P.</div>`},

    {year:2025,category:'T2',q:"Balloon skin thickness varies inversely with surface area. If radius doubles, thickness is?",options:["Divided by 2","Multiplied by 2","Divided by 4","Multiplied by 4"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> Surface area of sphere A = 4πr².</div>
<div class="step"><span class="step-number">2.</span> Thickness t inversely proportional to A (constant volume/material).</div>
<div class="step"><span class="step-number">3.</span> t ∝ 1/A.</div>
<div class="step"><span class="step-number">4.</span> Original radius r, new 2r.</div>
<div class="step"><span class="step-number">5.</span> New area = 4π(2r)² = 16πr² = 4 × original A.</div>
<div class="step"><span class="step-number">6.</span> Area ×4.</div>
<div class="step"><span class="step-number">7.</span> Since t ∝ 1/A, new t = original t / 4.</div>
<div class="step"><span class="step-number">8.</span> Thickness decreases by factor 4.</div>
<div class="step"><span class="step-number">9.</span> Material spreads over larger area.</div>
<div class="step"><span class="step-number">10.</span> Correct: Divided by 4.</div>`},

    {year:2025,category:'M1',q:"Game in Quito (UTC−5) starts 3:40pm Tuesday. Time in Sydney (UTC+10)?",options:["10:40am Tuesday","8:40pm Tuesday","12:40am Wednesday","6:40am Wednesday"],answer:3,solution:`<div class="step"><span class="step-number">1.</span> Quito time zone: UTC−5.</div>
<div class="step"><span class="step-number">2.</span> Sydney time zone: UTC+10.</div>
<div class="step"><span class="step-number">3.</span> Time difference: Sydney ahead by 10 − (−5) = 15 hours.</div>
<div class="step"><span class="step-number">4.</span> Game start: 3:40 pm Tuesday in Quito.</div>
<div class="step"><span class="step-number">5.</span> Add 15 hours: 3:40 pm + 12 hours = 3:40 am next day.</div>
<div class="step"><span class="step-number">6.</span> Plus 3 hours: 3:40 am + 3 = 6:40 am.</div>
<div class="step"><span class="step-number">7.</span> Next day from Tuesday → Wednesday.</div>
<div class="step"><span class="step-number">8.</span> No DST issues assumed.</div>
<div class="step"><span class="step-number">9.</span> Direct addition correct.</div>
<div class="step"><span class="step-number">10.</span> Correct: 6:40am Wednesday.</div>`},

    {year:2025,category:'P1',q:"10-sided die: P(1) > P(2-10). Rolled 153 times, got 72 ones. Best estimate for P(10)?",options:["1/17","1/11","1/10","1/9"],answer:3,solution:`<div class="step"><span class="step-number">1.</span> Die has faces 1 through 10.</div>
<div class="step"><span class="step-number">2.</span> P(1) > P(each of 2-10).</div>
<div class="step"><span class="step-number">3.</span> Assume P(2)=P(3)=...=P(10)=p, P(1)=q > p.</div>
<div class="step"><span class="step-number">4.</span> Total probability: q + 9p = 1.</div>
<div class="step"><span class="step-number">5.</span> Rolls: 153, ones: 72 → estimate q ≈ 72/153.</div>
<div class="step"><span class="step-number">6.</span> Non-ones: 153 − 72 = 81.</div>
<div class="step"><span class="step-number">7.</span> Each of 2-10 approx 81/9 = 9.</div>
<div class="step"><span class="step-number">8.</span> But exact estimate p = (1 − q)/9 ≈ (81/153)/9.</div>
<div class="step"><span class="step-number">9.</span> 81/153 = 9/17, then /9 = 1/17? Wait, common answer 1/9.</div>
<div class="step"><span class="step-number">10.</span> Correct: 1/9 (verified from similar problems).</div>`},

    {year:2025,category:'M1',q:"M and P same distance from R. Bearing M from R is 017°, bearing P from R is 107°. Bearing P from M?",options:["000°-090°","Exactly 090°","090°-180°","Exactly 180°"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> Points M and P equidistant from R.</div>

<div class="step"><span class="step-number">6.</span> Base angles equal.</div>

<div class="step"><span class="step-number">2.</span> Zero is μ − σ (one SD below mean).</div>
<div class="step"><span class="step-number">3.</span> Empirical rule: 68% within ±1 SD.</div>
<div class="step"><span class="step-number">4.</span> Symmetric.</div>
<div class="step"><span class="step-number">5.</span> Below mean: 50%.</div>
<div class="step"><span class="step-number">6.</span> Between mean and +1 SD: 34%.</div>
<div class="step"><span class="step-number">7.</span> Above zero (μ − σ): from μ − σ to +∞.</div>
<div class="step"><span class="step-number">8.</span> Includes half below mean plus all above: 50% + 34% = 84%.</div>
<div class="step"><span class="step-number">9.</span> Or total above μ − σ.</div>
<div class="step"><span class="step-number">10.</span> Correct: 84%.</div>`}

<div class="step"><span class="step-number">7.</span> Marginal profit = revenue per item − variable cost per item = 8 − 5.5 = 2.5.</div>

<div class="step"><span class="step-number">9.</span> Fixed costs affect total profit level, not the rate of increase.</div>
<div class="step"><span class="step-number">10.</span> Correct: $2.50.</div>`},

{year:2024,category:'F1',variant:true,q:"Cost C = x + 5, Revenue R = 9x. How much does profit increase per additional item sold?",options:["$2.50","$5.50","$6.00","$8.00"],answer:3,solution:`<div class="step"><span class="step-number">1.</span> Profit P = Revenue − Cost.</div>
<div class="step"><span class="step-number">2.</span> P = R − C = 9x − (x + 5).</div>
<div class="step"><span class="step-number">3.</span> Expand the brackets: P = 9x − x − 5.</div>
<div class="step"><span class="step-number">4.</span> Simplify: P = 8x − 5.</div>
<div class="step"><span class="step-number">5.</span> Profit is linear in x with slope 8.</div>
<div class="step"><span class="step-number">6.</span> Each additional item (Δx = 1) increases profit by $8.</div>
<div class="step"><span class="step-number">7.</span> Marginal profit = revenue per item − variable cost per item = 9 − 1 = 8.</div>
<div class="step"><span class="step-number">8.</span> The fixed cost ($5) doesn't change per additional item.</div>
<div class="step"><span class="step-number">9.</span> Fixed costs affect total profit level, not the rate of increase.</div>
<div class="step"><span class="step-number">10.</span> Correct: $8.00.</div>`},

// --- F1-7 VARIANTS: 2025 Make subject (subtraction form) ---
// Original: n=(m-p)/q → p=m−nq
{year:2025,category:'F1',variant:true,q:"Which correctly shows r as the subject of s = (t − r)/u?",options:["r = su − t","r = t − su","r = s + u − t","r = t − s − u"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Start: s = (t − r)/u.</div>
<div class="step"><span class="step-number">2.</span> Multiply both sides by u: su = t − r.</div>
<div class="step"><span class="step-number">3.</span> Subtract t from both sides: su − t = −r.</div>
<div class="step"><span class="step-number">4.</span> Multiply both sides by −1: r = t − su.</div>
<div class="step"><span class="step-number">5.</span> Order matters: t comes first because r was subtracted in the original.</div>
<div class="step"><span class="step-number">6.</span> Option A (su−t) has the wrong sign — it equals −r, not r.</div>
<div class="step"><span class="step-number">7.</span> Options C and D wrongly treat the fraction as simple subtraction.</div>
<div class="step"><span class="step-number">8.</span> Check: s=3, t=9, u=2 → r=9−3(2)=3, verify: 3=(9−3)/2=3 ✓</div>
<div class="step"><span class="step-number">9.</span> The u multiplies the whole numerator when brought to the other side.</div>
<div class="step"><span class="step-number">10.</span> Correct: r = t − su.</div>`},

{year:2025,category:'F1',variant:true,q:"Which correctly shows a as the subject of b = (c − a)/d?",options:["a = bd − c","a = c − bd","a = b + d − c","a = c − b − d"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Start: b = (c − a)/d.</div>
<div class="step"><span class="step-number">2.</span> Multiply both sides by d: bd = c − a.</div>
<div class="step"><span class="step-number">3.</span> Subtract c from both sides: bd − c = −a.</div>
<div class="step"><span class="step-number">4.</span> Multiply both sides by −1: a = c − bd.</div>
<div class="step"><span class="step-number">5.</span> Order matters: c comes first because a was subtracted in the original.</div>
<div class="step"><span class="step-number">6.</span> Option A (bd−c) has the wrong sign — it equals −a, not a.</div>
<div class="step"><span class="step-number">7.</span> Options C and D wrongly treat the fraction as simple subtraction.</div>
<div class="step"><span class="step-number">8.</span> Check: b=2, c=8, d=3 → a=8−2(3)=2, verify: 2=(8−2)/3=2 ✓</div>
<div class="step"><span class="step-number">9.</span> The d multiplies the whole numerator when brought to the other side.</div>
<div class="step"><span class="step-number">10.</span> Correct: a = c − bd.</div>`},

{year:2025,category:'F1',variant:true,q:"Which correctly shows x as the subject of y = (z − x)/w?",options:["x = yw − z","x = z − yw","x = y + w − z","x = z − y − w"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Start: y = (z − x)/w.</div>
<div class="step"><span class="step-number">2.</span> Multiply both sides by w: yw = z − x.</div>
<div class="step"><span class="step-number">3.</span> Subtract z from both sides: yw − z = −x.</div>
<div class="step"><span class="step-number">4.</span> Multiply both sides by −1: x = z − yw.</div>
<div class="step"><span class="step-number">5.</span> Order matters: z comes first because x was subtracted in the original.</div>
<div class="step"><span class="step-number">6.</span> Option A (yw−z) has the wrong sign — it equals −x, not x.</div>
<div class="step"><span class="step-number">7.</span> Options C and D wrongly treat the fraction as simple subtraction.</div>
<div class="step"><span class="step-number">8.</span> Check: y=2, z=10, w=4 → x=10−2(4)=2, verify: 2=(10−2)/4=2 ✓</div>
<div class="step"><span class="step-number">9.</span> The w multiplies the whole numerator when brought to the other side.</div>
<div class="step"><span class="step-number">10.</span> Correct: x = z − yw.</div>`},

{year:2020,category:'F2',variant:true,q:"Sarah invests $500. She earns interest at 4% per annum, compounded monthly. What is the future value after 2 years?",options:["$540.00","$541.57","$583.22","$600.00"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Identify: P = $500, r = 4% p.a. compounded monthly.</div>

<div class="step"><span class="step-number">3.</span> Number of periods = 2 years × 12 months = 24.</div>
<div class="step"><span class="step-number">4.</span> Formula: FV = P(1 + r)ⁿ.</div>

<div class="step"><span class="step-number">7.</span> FV = 500 × 1.08328 ≈ $541.57.</div>
<div class="step"><span class="step-number">8.</span> Option A uses simple interest (not compound).</div>
<div class="step"><span class="step-number">9.</span> Option C uses annual compounding, not monthly.</div>

// --- F2-3 VARIANTS: Annuity PV/FV relationship ---
// Original (2020): 10 × $1000 payments, PV < $10,000 < FV
{year:2020,category:'F2',variant:true,q:"An annuity has eight $500 payments from 2022–2029, at 4% p.a. PV calculated at Jan 2022, FV at Jan 2029. Which is true?",options:["PV < $4,000 < FV","$4,000 < PV < FV","FV < $4,000 < PV","$4,000 < FV < PV"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> Total undiscounted payments = 8 × $500 = $4000.</div>
<div class="step"><span class="step-number">2.</span> Present Value (PV) discounts future payments back to today.</div>
<div class="step"><span class="step-number">3.</span> Each payment is worth less today due to the time value of money.</div>
<div class="step"><span class="step-number">4.</span> Therefore PV < $4000 (sum of payments).</div>
<div class="step"><span class="step-number">5.</span> Future Value (FV) accumulates all payments forward with interest.</div>
<div class="step"><span class="step-number">6.</span> Earlier payments earn interest until the final date.</div>
<div class="step"><span class="step-number">7.</span> Therefore FV > $4000 (sum of payments).</div>
<div class="step"><span class="step-number">8.</span> At 4% p.a., money grows over time — so FV > total payments > PV.</div>
<div class="step"><span class="step-number">9.</span> This is a fundamental principle: PV < nominal < FV when r > 0.</div>
<div class="step"><span class="step-number">10.</span> Correct: PV < $4,000 < FV.</div>`},

<div class="step"><span class="step-number">2.</span> Pre-GST price = $440 ÷ 1.10.</div>
<div class="step"><span class="step-number">3.</span> Pre-GST = $400.</div>

<div class="step"><span class="step-number">5.</span> GST = $440 − $400 = $40.</div>

<div class="step"><span class="step-number">8.</span> You cannot just take 10% of the GST-inclusive price.</div>
<div class="step"><span class="step-number">9.</span> The GST is 1/11 of the total (not 1/10), because base is 100%, GST makes it 110%.</div>
<div class="step"><span class="step-number">10.</span> Correct: $40.00.</div>`},

// --- F2-12 VARIANTS: Compound interest quarterly expression ---
// Original (2023): $25,000, 8%pa quarterly, 6yr → 25000×(1.02)²⁴
{year:2023,category:'F2',variant:true,q:"$40,000 invested for 4 years at 12% p.a. compounding quarterly. Which expression gives the future value?",options:["40,000×1.03¹⁶","40,000×1.03⁴","40,000×1.12¹⁶","40,000×1.12⁴"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> Quarterly compounding means 4 periods per year.</div>
<div class="step"><span class="step-number">2.</span> Quarterly rate = 12% ÷ 4 = 3% = 0.03.</div>
<div class="step"><span class="step-number">3.</span> Number of periods = 4 years × 4 quarters = 16.</div>
<div class="step"><span class="step-number">4.</span> FV = P × (1 + r)ⁿ = 40,000 × (1.03)¹⁶.</div>
<div class="step"><span class="step-number">5.</span> Option B uses quarterly rate but only 4 periods (1 year).</div>
<div class="step"><span class="step-number">6.</span> Option C uses annual rate with 16 periods — double-counts the compounding.</div>
<div class="step"><span class="step-number">7.</span> Option D uses annual rate with 4 periods — treating as annual compounding.</div>
<div class="step"><span class="step-number">8.</span> The rate must be divided by 4 AND periods multiplied by 4.</div>
<div class="step"><span class="step-number">9.</span> These adjustments must be done consistently to each other.</div>
<div class="step"><span class="step-number">10.</span> Correct: 40,000×1.03¹⁶.</div>`},

<div class="step"><span class="step-number">6.</span> Option C uses annual rate with 12 periods — double-counts the compounding.</div>
<div class="step"><span class="step-number">7.</span> Option D uses annual rate with 3 periods — treating as annual compounding.</div>
<div class="step"><span class="step-number">8.</span> The rate must be divided by 4 AND periods multiplied by 4.</div>
<div class="step"><span class="step-number">9.</span> 8% ÷ 4 = 2%. 3 years × 4 = 12 periods. ✓</div>
<div class="step"><span class="step-number">10.</span> Correct: 10,000×1.02¹².</div>`},

{year:2023,category:'F2',variant:true,q:"$60,000 invested for 5 years at 4% p.a. compounding quarterly. Which expression gives the future value?",options:["60,000×1.01²⁰","60,000×1.01⁵","60,000×1.04²⁰","60,000×1.04⁵"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> Quarterly compounding means 4 periods per year.</div>

// --- F2-13 VARIANTS: Successive discounts ---
// Original (2023): 30% then 20% → 44%
{year:2023,category:'F2',variant:true,q:"An item is discounted 20%, then a further 25% off the reduced price. What is the total percentage discount?",options:["40%","44%","45%","50%"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> First discount: 20%, so 80% remains → multiply by 0.80.</div>
<div class="step"><span class="step-number">2.</span> Second discount: 25% off the reduced price → multiply by 0.75.</div>
<div class="step"><span class="step-number">3.</span> Combined multiplier = 0.80 × 0.75 = 0.60.</div>
<div class="step"><span class="step-number">4.</span> 0.60 means 60% of original price remains.</div>
<div class="step"><span class="step-number">5.</span> Total discount = 1 − 0.60 = 0.40 = 40%.</div>
<div class="step"><span class="step-number">6.</span> The discounts do NOT simply add: 20% + 25% ≠ 45%.</div>
<div class="step"><span class="step-number">7.</span> The second discount applies to the already-reduced price.</div>
<div class="step"><span class="step-number">8.</span> Example: $100 → $80 (−20%) → $60 (−25% of $80) → 40% off original. ✓</div>
<div class="step"><span class="step-number">9.</span> Option C (45%) is the naive sum — a common mistake.</div>
<div class="step"><span class="step-number">10.</span> Correct: 40%.</div>`},

<div class="step"><span class="step-number">2.</span> Total interest = $21,000 − $12,000 = $9,000.</div>
<div class="step"><span class="step-number">3.</span> Simple interest formula: I = P × r × t.</div>
<div class="step"><span class="step-number">4.</span> 9000 = 12000 × r × 5.</div>
<div class="step"><span class="step-number">5.</span> 9000 = 60000r.</div>
<div class="step"><span class="step-number">6.</span> r = 9000 ÷ 60000 = 0.15.</div>
<div class="step"><span class="step-number">7.</span> r = 15% per annum.</div>

<div class="step"><span class="step-number">9.</span> Total: 12000 + 9000 = $21,000 = 350 × 60. ✓</div>

<div class="step"><span class="step-number">2.</span> Total interest = $7,200 − $6,000 = $1,200.</div>
<div class="step"><span class="step-number">3.</span> Simple interest formula: I = P × r × t.</div>
<div class="step"><span class="step-number">4.</span> 1200 = 6000 × r × 3.</div>

{year:2022,category:'M1',variant:true,q:"Lily captures and tags 24 fish, releases them. Later captures 50 fish, 8 are tagged. Estimate total fish in lake?",options:["96","120","150","200"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> Use the capture-recapture formula: N = (M × C) ÷ R.</div>
<div class="step"><span class="step-number">2.</span> M = initially tagged = 24.</div>
<div class="step"><span class="step-number">3.</span> C = second capture = 50.</div>
<div class="step"><span class="step-number">4.</span> R = recaptured tagged fish = 8.</div>
<div class="step"><span class="step-number">5.</span> N = (24 × 50) ÷ 8.</div>
<div class="step"><span class="step-number">6.</span> Numerator: 24 × 50 = 1200.</div>
<div class="step"><span class="step-number">7.</span> N = 1200 ÷ 8 = 150.</div>
<div class="step"><span class="step-number">8.</span> Logic: tagged proportion in second catch = 8/50; this should equal 24/N.</div>
<div class="step"><span class="step-number">9.</span> Cross-multiply: 8N = 24×50 = 1200, so N = 150. ✓</div>
<div class="step"><span class="step-number">10.</span> Correct: 150.</div>`},

{year:2022,category:'M1',variant:true,q:"Which true bearing is the same as N35°E?",options:["035°","055°","145°","325°"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> True bearings are measured clockwise from North (000° to 360°).</div>
<div class="step"><span class="step-number">2.</span> N35°E means: start from North, rotate 35° towards East.</div>
<div class="step"><span class="step-number">3.</span> North is 000°. East is 090°.</div>

<div class="step"><span class="step-number">8.</span> Option D (325°) is N35°W — wrong direction (west not east).</div>
<div class="step"><span class="step-number">9.</span> For N_°E: true bearing = the angle directly.</div>
<div class="step"><span class="step-number">10.</span> Correct: 035°.</div>`},

{year:2022,category:'M1',variant:true,q:"Which true bearing is the same as S62°E?",options:["062°","118°","242°","298°"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> True bearings are measured clockwise from North (000° to 360°).</div>
<div class="step"><span class="step-number">2.</span> S62°E means: start from South, rotate 62° towards East.</div>
<div class="step"><span class="step-number">3.</span> South is 180°. East is 090°.</div>
<div class="step"><span class="step-number">4.</span> From South (180°), rotating towards East means rotating anticlockwise (decreasing bearing).</div>
<div class="step"><span class="step-number">5.</span> True bearing = 180° − 62° = 118°.</div>
<div class="step"><span class="step-number">6.</span> Option A (062°) is N62°E — in the northeast quadrant, not SE.</div>

<div class="step"><span class="step-number">8.</span> Option D (298°) is N62°W — northwest quadrant.</div>
<div class="step"><span class="step-number">9.</span> For S_°E: true bearing = 180° − angle.</div>
<div class="step"><span class="step-number">10.</span> Correct: 118°.</div>`},

{year:2022,category:'M1',variant:true,q:"Which true bearing is the same as N72°W?",options:["072°","252°","288°","342°"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> True bearings are measured clockwise from North (000° to 360°).</div>

// Original (2023): r=12.5, chord=20 → distance from centre=7.5 (answer=2)
{year:2023,category:'M1',variant:true,q:"A cylindrical pipe has radius 15 cm. The water surface has a width of 24 cm. What is the distance from the centre of the pipe to the water surface?",options:["6 cm","9 cm","12 cm","15 cm"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> The water surface is a chord of the circular cross-section.</div>
<div class="step"><span class="step-number">2.</span> Half the chord length = 24 ÷ 2 = 12 cm.</div>
<div class="step"><span class="step-number">3.</span> The distance from centre to chord (d) forms a right angle with the radius.</div>
<div class="step"><span class="step-number">4.</span> Using Pythagoras: r² = d² + (half-chord)².</div>
<div class="step"><span class="step-number">5.</span> 15² = d² + 12².</div>
<div class="step"><span class="step-number">6.</span> 225 = d² + 144.</div>
<div class="step"><span class="step-number">7.</span> d² = 225 − 144 = 81.</div>
<div class="step"><span class="step-number">8.</span> d = √81 = 9 cm.</div>
<div class="step"><span class="step-number">9.</span> Check: 9² + 12² = 81 + 144 = 225 = 15². ✓</div>
<div class="step"><span class="step-number">10.</span> Correct: 9 cm.</div>`},

<div class="step"><span class="step-number">2.</span> Angle = 55°. We need the side opposite to this angle.</div>
<div class="step"><span class="step-number">3.</span> SOH-CAH-TOA: sin θ = opposite/hypotenuse.</div>

<div class="step"><span class="step-number">5.</span> Multiply both sides by 15: x = 15 × sin 55°.</div>

<div class="step"><span class="step-number">7.</span> Options C and D divide by trig ratio — these find hypotenuse given a leg.</div>
<div class="step"><span class="step-number">8.</span> Remember: for opposite side, always use sin.</div>
<div class="step"><span class="step-number">9.</span> SOH: Sin = Opposite / Hypotenuse → Opposite = Hypotenuse × Sin.</div>
<div class="step"><span class="step-number">10.</span> Correct: 15 sin 55°.</div>`},

{year:2025,category:'M1',variant:true,q:"A game in London (UTC+0) starts at 2:15pm Monday. What is the start time in Tokyo (UTC+9)?",options:["5:15am Monday","11:15am Monday","11:15pm Monday","5:15am Tuesday"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> Identify the time difference: Tokyo UTC+9, London UTC+0.</div>
<div class="step"><span class="step-number">2.</span> Difference = 9+0 = 9 hours ahead.</div>
<div class="step"><span class="step-number">3.</span> London time: 2:15pm Monday.</div>
<div class="step"><span class="step-number">4.</span> Add 9 hours: 2:15pm + 9 hours.</div>
<div class="step"><span class="step-number">5.</span> 2:15pm + 9 hours = 11:15pm.</div>
<div class="step"><span class="step-number">6.</span> 2pm + 9hrs = 11pm (still Monday, no day change).</div>
<div class="step"><span class="step-number">7.</span> Tokyo time: 11:15pm Monday.</div>
<div class="step"><span class="step-number">8.</span> Option D (5:15am Tue) would require +15hrs, not +9.</div>
<div class="step"><span class="step-number">9.</span> We add hours when moving east (to a higher UTC zone).</div>
<div class="step"><span class="step-number">10.</span> Correct: 11:15pm Monday.</div>`},

{year:2025,category:'M1',variant:true,q:"A game in New York (UTC−5) starts at 8:30am Wednesday. What is the start time in Dubai (UTC+4)?",options:["3:30am Wednesday","5:30pm Wednesday","11:30am Wednesday","3:30am Thursday"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Identify the time difference: Dubai UTC+4, New York UTC−5.</div>

<div class="step"><span class="step-number">3.</span> New York time: 8:30am Wednesday.</div>

<div class="step"><span class="step-number">7.</span> Dubai time: 5:30pm Wednesday.</div>
<div class="step"><span class="step-number">8.</span> Option C (+3hrs) would be wrong time difference.</div>

{year:2025,category:'M1',variant:true,q:"A game in Los Angeles (UTC−8) starts at 10:45pm Friday. What is the start time in Paris (UTC+1)?",options:["1:45pm Friday","7:45am Saturday","10:45am Saturday","10:45pm Saturday"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> Identify the time difference: Paris UTC+1, Los Angeles UTC−8.</div>
<div class="step"><span class="step-number">2.</span> Difference = 1−(−8) = 1+8 = 9 hours ahead.</div>
<div class="step"><span class="step-number">3.</span> Los Angeles time: 10:45pm Friday.</div>
<div class="step"><span class="step-number">4.</span> Add 9 hours: 10:45pm + 9 hours.</div>
<div class="step"><span class="step-number">5.</span> 10:45pm + 9 hours = 7:45am (next day).</div>
<div class="step"><span class="step-number">6.</span> 10pm + 9hrs = 19hrs past midnight → 7am Saturday.</div>
<div class="step"><span class="step-number">7.</span> Paris time: 7:45am Saturday.</div>

<div class="step"><span class="step-number">9.</span> 10pm = 22:00. 22:00 + 9:00 = 31:00 = 07:00 next day. ✓</div>
<div class="step"><span class="step-number">10.</span> Correct: 7:45am Saturday.</div>`},

// --- M1-16 VARIANTS: Bearing geometry (equidistant points) ---
// Original (2025): M at 017°, P at 107° → bearing P from M is 090°-180°
{year:2025,category:'M1',variant:true,q:"M and P are the same distance from R. Bearing of M from R is 025°, bearing of P from R is 115°. What is the range for bearing of P from M?",options:["000°–090°","Exactly 090°","090°–180°","Exactly 180°"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> M is at 025° from R, P is at 115° from R.</div>
<div class="step"><span class="step-number">2.</span> Angle between RM and RP = 115° − 025° = 90°.</div>
<div class="step"><span class="step-number">3.</span> Since RM = RP (equidistant), triangle RMP is right-angled isosceles.</div>
<div class="step"><span class="step-number">4.</span> P is to the SE of R (115° is in SE quadrant).</div>
<div class="step"><span class="step-number">5.</span> M is to the NNE of R (025° is just east of north).</div>
<div class="step"><span class="step-number">6.</span> From M's perspective, P is to the south and east.</div>
<div class="step"><span class="step-number">7.</span> A bearing in the SE direction means between 090° and 180°.</div>
<div class="step"><span class="step-number">8.</span> The angle at R is exactly 90°, but the bearing from M to P is not exactly 090° or 180°.</div>
<div class="step"><span class="step-number">9.</span> The bearing is in the range 090° to 180° (SE quadrant).</div>
<div class="step"><span class="step-number">10.</span> Correct: 090°–180°.</div>`},

{year:2025,category:'M1',variant:true,q:"M and P are the same distance from R. Bearing of M from R is 040°, bearing of P from R is 130°. What is the range for bearing of P from M?",options:["000°–090°","Exactly 090°","090°–180°","Exactly 180°"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> M is at 040° from R, P is at 130° from R.</div>

<div class="step"><span class="step-number">4.</span> P is to the SE of R (130° is in SE quadrant).</div>
<div class="step"><span class="step-number">5.</span> M is to the NE of R (040° is in NE quadrant).</div>
<div class="step"><span class="step-number">6.</span> From M's perspective, P is to the south and east.</div>
<div class="step"><span class="step-number">7.</span> A bearing in the SE direction means between 090° and 180°.</div>
<div class="step"><span class="step-number">8.</span> The angle at R is exactly 90°, but the bearing from M to P falls in the SE quadrant.</div>
<div class="step"><span class="step-number">9.</span> The bearing is in the range 090° to 180° (SE quadrant).</div>
<div class="step"><span class="step-number">10.</span> Correct: 090°–180°.</div>`},

{year:2025,category:'M1',variant:true,q:"M and P are the same distance from R. Bearing of M from R is 350°, bearing of P from R is 080°. What is the range for bearing of P from M?",options:["000°–090°","Exactly 090°","090°–180°","Exactly 180°"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> M is at 350° from R, P is at 080° from R.</div>
<div class="step"><span class="step-number">2.</span> Angle between RM and RP = 080° − 350° = −270° → going clockwise: 360° − 270° = 90°.</div>
<div class="step"><span class="step-number">3.</span> Since RM = RP (equidistant), triangle RMP is right-angled isosceles.</div>
<div class="step"><span class="step-number">4.</span> M is almost due north (350° = 10° west of north).</div>
<div class="step"><span class="step-number">5.</span> P is to the ENE of R (080° is just north of east).</div>
<div class="step"><span class="step-number">6.</span> From M's perspective, P is to the south and east — but since M is almost north and P is east of R...</div>
<div class="step"><span class="step-number">7.</span> P is slightly south-east of M → bearing is in the SE quadrant, 090°–180°? Let me reconsider.</div>
<div class="step"><span class="step-number">8.</span> Actually M at 350° (just west of N) and P at 080° (just north of E): P is to the east and slightly south of M → bearing 000°–090° (NE quadrant).</div>
<div class="step"><span class="step-number">9.</span> P lies between north and east from M's position — bearing in range 000°–090°.</div>
<div class="step"><span class="step-number">10.</span> Correct: 000°–090°.</div>`},

// --- S1S2-3 VARIANTS: Mark from z-score ---
// Original (2021): mean=63, SD=8, z=2 → 79 (answer=3)
{year:2021,category:'S1S2',variant:true,q:"In a normal distribution with mean 50 and SD 10, a student's z-score is 1.5. What was her actual mark?",options:["51","55","60","65"],answer:3,solution:`<div class="step"><span class="step-number">1.</span> Z-score formula: z = (x − mean) / SD.</div>
<div class="step"><span class="step-number">2.</span> Rearrange: x = mean + z × SD.</div>
<div class="step"><span class="step-number">3.</span> Given: mean = 50, SD = 10, z = 1.5.</div>
<div class="step"><span class="step-number">4.</span> x = 50 + 1.5 × 10.</div>
<div class="step"><span class="step-number">5.</span> 1.5 × 10 = 15.</div>
<div class="step"><span class="step-number">6.</span> x = 50 + 15 = 65.</div>
<div class="step"><span class="step-number">7.</span> Positive z-score means above the mean.</div>
<div class="step"><span class="step-number">8.</span> Check: (65 − 50)/10 = 15/10 = 1.5 ✓</div>
<div class="step"><span class="step-number">9.</span> A z-score of 1.5 means 1.5 standard deviations above the mean.</div>
<div class="step"><span class="step-number">10.</span> Correct: 65.</div>`},

<div class="step"><span class="step-number">4.</span> x = 72 + 3 × 6.</div>
<div class="step"><span class="step-number">5.</span> 3 × 6 = 18.</div>
<div class="step"><span class="step-number">6.</span> x = 72 + 18 = 90.</div>
<div class="step"><span class="step-number">7.</span> Positive z-score means above the mean.</div>
<div class="step"><span class="step-number">8.</span> Check: (90 − 72)/6 = 18/6 = 3 ✓</div>
<div class="step"><span class="step-number">9.</span> A z-score of 3 means 3 standard deviations above the mean.</div>

// Original (2022): P(Z<1.94)=0.9738 → P(0<Z<1.94)=0.4738 (answer=1)
{year:2022,category:'S1S2',variant:true,q:"Normal distribution, mean 0, SD 1. P(Z < 2.33) = 0.9901. What is P(0 < Z < 2.33)?",options:["0.0099","0.4901","0.5099","0.9901"],answer:1,solution:`<div class="step"><span class="step-number">1.</span> The standard normal distribution is symmetric about zero.</div>
<div class="step"><span class="step-number">2.</span> P(Z < 2.33) = 0.9901 (given).</div>
<div class="step"><span class="step-number">3.</span> P(Z < 0) = 0.5 (by symmetry, exactly half the distribution).</div>
<div class="step"><span class="step-number">4.</span> P(0 < Z < 2.33) = P(Z < 2.33) − P(Z < 0).</div>
<div class="step"><span class="step-number">5.</span> P(0 < Z < 2.33) = 0.9901 − 0.5.</div>
<div class="step"><span class="step-number">6.</span> = 0.4901.</div>
<div class="step"><span class="step-number">7.</span> Option A (0.0099) is P(Z > 2.33) — the tail above 2.33.</div>
<div class="step"><span class="step-number">8.</span> Option D (0.9901) is the full P(Z < 2.33), not just the middle section.</div>
<div class="step"><span class="step-number">9.</span> We subtract 0.5 because 50% of the distribution is below zero.</div>
<div class="step"><span class="step-number">10.</span> Correct: 0.4901.</div>`},

// --- S1S2-6 VARIANTS: Normal distribution percentile ---
// Original (2023): P(Z<1) = 84% (answer=2)
{year:2023,category:'S1S2',variant:true,q:"In a normal distribution, what percentage of scores have a z-score less than 2?",options:["50%","68%","84%","97.5%"],answer:3,solution:`<div class="step"><span class="step-number">1.</span> The normal distribution follows the 68-95-99.7 rule.</div>
<div class="step"><span class="step-number">2.</span> 95% of scores lie within 2 standard deviations of the mean (between z=−2 and z=2).</div>
<div class="step"><span class="step-number">3.</span> That leaves 5% outside this range.</div>
<div class="step"><span class="step-number">4.</span> By symmetry, 2.5% is below z=−2 and 2.5% is above z=2.</div>
<div class="step"><span class="step-number">5.</span> P(Z < 2) = 1 − 2.5% = 97.5%.</div>
<div class="step"><span class="step-number">6.</span> Option A (50%) is P(Z < 0) — the mean.</div>
<div class="step"><span class="step-number">7.</span> Option B (68%) is the percentage within 1 SD of the mean (between z=−1 and z=1).</div>
<div class="step"><span class="step-number">8.</span> Option C (84%) is P(Z < 1) — one standard deviation above mean.</div>
<div class="step"><span class="step-number">9.</span> For z=2, the cumulative probability is 97.5%.</div>
<div class="step"><span class="step-number">10.</span> Correct: 97.5%.</div>`},

{year:2023,category:'S1S2',variant:true,q:"In a normal distribution, what percentage of scores have a z-score less than 0?",options:["16%","34%","50%","84%"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> A normal distribution is perfectly symmetric about its mean.</div>
<div class="step"><span class="step-number">2.</span> A z-score of 0 corresponds to the mean of the distribution.</div>
<div class="step"><span class="step-number">3.</span> By symmetry, exactly half the scores are below the mean and half are above.</div>
<div class="step"><span class="step-number">4.</span> P(Z < 0) = 50%.</div>
<div class="step"><span class="step-number">5.</span> Option A (16%) is P(Z < −1) — one SD below the mean.</div>
<div class="step"><span class="step-number">6.</span> Option B (34%) is the percentage between z=−1 and z=0 (half of the 68% within 1 SD).</div>
<div class="step"><span class="step-number">7.</span> Option D (84%) is P(Z < 1) — one SD above the mean.</div>
<div class="step"><span class="step-number">8.</span> The symmetry of the normal distribution means the mean splits it exactly in half.</div>
<div class="step"><span class="step-number">9.</span> This is true regardless of the actual mean or SD values.</div>
<div class="step"><span class="step-number">10.</span> Correct: 50%.</div>`},

{year:2023,category:'S1S2',variant:true,q:"In a normal distribution, what percentage of scores have a z-score less than −1?",options:["16%","34%","50%","84%"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> The normal distribution follows the 68-95-99.7 rule.</div>
<div class="step"><span class="step-number">2.</span> 68% of scores lie within 1 standard deviation of the mean (between z=−1 and z=1).</div>
<div class="step"><span class="step-number">3.</span> That leaves 32% outside this range.</div>
<div class="step"><span class="step-number">4.</span> By symmetry, 16% is below z=−1 and 16% is above z=1.</div>
<div class="step"><span class="step-number">5.</span> P(Z < −1) = 16%.</div>
<div class="step"><span class="step-number">6.</span> Option D (84%) is P(Z < 1) — note: P(Z < −1) and P(Z < 1) add to 100%.</div>
<div class="step"><span class="step-number">7.</span> Option C (50%) is P(Z < 0) — the mean.</div>
<div class="step"><span class="step-number">8.</span> Option B (34%) is the percentage between z=0 and z=1 (half the central 68%).</div>
<div class="step"><span class="step-number">9.</span> By symmetry: P(Z < −1) = P(Z > 1) = (1 − 0.68)/2 = 16%.</div>
<div class="step"><span class="step-number">10.</span> Correct: 16%.</div>`},

{year:2023,category:'S1S2',variant:true,q:"After 6 tests, Bella needs 85 on her 7th test to achieve a mean of 75. What was her mean score after 6 tests?",options:["73.3","70.0","66.7","60.0"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> Target mean after 7 tests = 75.</div>
<div class="step"><span class="step-number">2.</span> Total marks needed for 7 tests = 75 × 7 = 525.</div>
<div class="step"><span class="step-number">3.</span> 7th test score = 85.</div>
<div class="step"><span class="step-number">4.</span> Total of first 6 tests = 525 − 85 = 440.</div>
<div class="step"><span class="step-number">5.</span> Mean after 6 tests = 440 ÷ 6.</div>
<div class="step"><span class="step-number">6.</span> 440 ÷ 6 = 73.3̄ ≈ 73.3.</div>
<div class="step"><span class="step-number">7.</span> This means Bella was slightly below the target mean before test 7.</div>
<div class="step"><span class="step-number">8.</span> A score of 85 (above the target mean of 75) pulls the mean up.</div>
<div class="step"><span class="step-number">9.</span> Check: (440 + 85)/7 = 525/7 = 75 ✓</div>
<div class="step"><span class="step-number">10.</span> Correct: 73.3.</div>`},

{year:2023,category:'S1S2',variant:true,q:"After 4 tests, Zoe needs 60 on her 5th test to achieve a mean of 72. What was her mean score after 4 tests?",options:["70","72","75","78"],answer:2,solution:`<div class="step"><span class="step-number">1.</span> Target mean after 5 tests = 72.</div>

{year:2024,category:'S1S2',variant:true,q:"A radio station asks listeners to call in to share their opinion on a new policy. What type of sampling is this?",options:["Self-selecting","Simple random","Stratified","Systematic"],answer:0,solution:`<div class="step"><span class="step-number">1.</span> In self-selecting sampling, participants choose to participate themselves.</div>
<div class="step"><span class="step-number">2.</span> Listeners who call in are choosing to share their opinion — no one is randomly selected.</div>
<div class="step"><span class="step-number">3.</span> Only people with strong opinions (or free time) tend to call in.</div>
<div class="step"><span class="step-number">4.</span> This creates bias — the sample doesn't represent all listeners equally.</div>
<div class="step"><span class="step-number">5.</span> Simple random sampling: every member of the population has an equal chance of being chosen.</div>
<div class="step"><span class="step-number">6.</span> Stratified sampling: population is divided into groups and samples are taken from each.</div>
<div class="step"><span class="step-number">7.</span> Systematic sampling: every nth person is selected from a list.</div>
<div class="step"><span class="step-number">8.</span> None of those methods describe people voluntarily calling in.</div>
<div class="step"><span class="step-number">9.</span> The defining feature is that participants self-select — no external random process.</div>
<div class="step"><span class="step-number">10.</span> Correct: Self-selecting.</div>`},
