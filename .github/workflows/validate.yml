name: Validate

# Runs on every push and PR — the project's first automated check.
# Catches malformed subject JSON and broken Cloudflare Function syntax
# before they reach a deploy (main auto-deploys to students on push).

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate subject JSON structure
        run: node scripts/validate_subjects.cjs

      # Ground truth is the committed key in data/answer-key/, extracted from the
      # NESA marking guidelines. The PDFs are not in the repo (copyright), so this
      # step reads no PDFs — it only compares the bank against the frozen key.
      - name: Check HSC answers against the official marking guidelines
        run: node scripts/check_answer_key.cjs

      # The written companion to the step above: official maximum marks per question
      # part, from data/answer-key/written/. A wrong mark value is not cosmetic — it
      # drives scoring and the AI marking prompt. Also reads no PDFs.
      - name: Check written-question marks against the official marking guidelines
        run: node scripts/check_written_key.cjs

      # Everything the mark check CANNOT see: scoring data that pays full marks for
      # a wrong answer, a keyword its own model answer can never credit, authoring
      # scratch-work in a student-facing model answer, and so on. Runs every known
      # content check over every subject at once — the point being that each of
      # these was previously invented for one subject and never run again anywhere,
      # so defects of a class already "fixed" kept resurfacing.
      #
      # --strict fails on the MARK-AFFECTING checks (a defect that moves a
      # student's mark) and the UNANSWERABLE ones (a question the renderer
      # cannot present correctly). The rest are quality reports printed for a
      # human to read; four classes (G/M/P/T) are known to produce false
      # positives and must never be bulk-fixed.
      #
      # ⚠️ The flag was missing here until 2026-09-07: this comment described
      # --strict while the command ran without it, so the audit could report a
      # marking defect and the build would still go green.
      - name: Content audit (marking-quality checks the mark check cannot see)
        run: node scripts/content_audit.cjs --strict

      - name: Syntax-check Cloudflare Pages Functions
        run: |
          set -e
          for f in $(find functions -name '*.js'); do
            echo "checking $f"
            node --check "$f"
          done

      - name: Run billing function tests
        run: npm test
