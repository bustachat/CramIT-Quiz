name: Validate

# Runs on every push and PR — the project's first automated check.
# Catches malformed subject JSON and broken Cloudflare Function syntax
# before they reach a deploy (main auto-deploys to students on push).

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate subject JSON structure
        run: node scripts/validate_subjects.cjs

      # Ground truth is the committed key in data/answer-key/, extracted from the
      # NESA marking guidelines. The PDFs are not in the repo (copyright), so this
      # step reads no PDFs — it only compares the bank against the frozen key.
      - name: Check HSC answers against the official marking guidelines
        run: node scripts/check_answer_key.cjs

      # The written companion to the step above: official maximum marks per question
      # part, from data/answer-key/written/. A wrong mark value is not cosmetic — it
      # drives scoring and the AI marking prompt. Also reads no PDFs.
      - name: Check written-question marks against the official marking guidelines
        run: node scripts/check_written_key.cjs

      - name: Syntax-check Cloudflare Pages Functions
        run: |
          set -e
          for f in $(find functions -name '*.js'); do
            echo "checking $f"
            node --check "$f"
          done

      - name: Run billing function tests
        run: npm test
